<title>ウェビナー素材ファイルツリー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#141a17; --ink-2:#43514b; --ink-3:#7a8880;
  --ground:#eff1ed; --surface:#ffffff; --surface-2:#f6f7f4;
  --line:#dde1da; --line-strong:#c5ccc1;
  --accent:#0e6b58; --accent-ink:#0b5546; --accent-soft:#dcebe5; --on-accent:#ffffff;
  --focus:#0e6b58;
  --t-csv:#a2712b; --t-txt:#5a6b7e; --t-py:#7a4fa0; --t-ps1:#2f6fa8;
  --t-md:#0e6b58; --t-code:#b4553f; --t-style:#a03e77; --t-img:#4a7a3e; --t-etc:#7a8880;
  --tint:14%;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Noto Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e6eae6; --ink-2:#a3b0a9; --ink-3:#6e7c75;
    --ground:#111614; --surface:#181f1c; --surface-2:#1e2723;
    --line:#2a3531; --line-strong:#3c4a44;
    --accent:#4fc3a1; --accent-ink:#7ad9bd; --accent-soft:#17302a; --on-accent:#0b1512;
    --focus:#4fc3a1;
    --t-csv:#d9a45b; --t-txt:#93a9be; --t-py:#b58fd6; --t-ps1:#7fb2e0;
    --t-md:#4fc3a1; --t-code:#e3927c; --t-style:#de8dba; --t-img:#8fc47e; --t-etc:#6e7c75;
    --tint:22%;
  }
}
:root[data-theme="dark"]{
  --ink:#e6eae6; --ink-2:#a3b0a9; --ink-3:#6e7c75;
  --ground:#111614; --surface:#181f1c; --surface-2:#1e2723;
  --line:#2a3531; --line-strong:#3c4a44;
  --accent:#4fc3a1; --accent-ink:#7ad9bd; --accent-soft:#17302a; --on-accent:#0b1512;
  --focus:#4fc3a1;
  --t-csv:#d9a45b; --t-txt:#93a9be; --t-py:#b58fd6; --t-ps1:#7fb2e0;
  --t-md:#4fc3a1; --t-code:#e3927c; --t-style:#de8dba; --t-img:#8fc47e; --t-etc:#6e7c75;
  --tint:22%;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

/* ---------- shell ---------- */
.shell{height:100vh;display:grid;grid-template-rows:auto 1fr}

.topbar{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;
  padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);
}
.repo{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.repo b{font-weight:700;font-size:16px;letter-spacing:.01em}
.repo .branch{
  font-family:var(--mono);font-size:11px;color:var(--accent-ink);
  background:var(--accent-soft);padding:2px 7px;border-radius:999px;
}
.stats{display:flex;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink-2);font-weight:500}

.main{display:grid;grid-template-columns:minmax(240px,320px) 1fr;min-height:0;overflow:hidden}

/* ---------- rail ---------- */
.rail{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.railhead{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.search{position:relative;display:flex}
.search input{
  width:100%;font:inherit;font-size:13px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
  padding:7px 10px 7px 30px;
}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:1.7}
.railactions{display:flex;gap:6px}
.mini{
  background:none;border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;font-size:11.5px;color:var(--ink-2);cursor:pointer;
}
.mini:hover{border-color:var(--line-strong);background:var(--surface-2)}

.tree{overflow:auto;padding:8px 8px 32px;flex:1;min-height:0}
.row{
  display:flex;align-items:center;gap:7px;width:100%;
  background:none;border:0;text-align:left;cursor:pointer;
  padding:3px 8px;border-radius:6px;line-height:1.45;
  font-size:13px;color:var(--ink-2);
}
.row:hover{background:var(--surface-2);color:var(--ink)}
.row[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.row .sz{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.row[aria-current="true"] .sz{color:var(--accent-ink)}
.row.dir{font-weight:500;color:var(--ink)}
.chev{width:12px;height:12px;flex:none;stroke:var(--ink-3);fill:none;stroke-width:2;transition:transform .15s ease}
.row.dir[aria-expanded="true"] .chev{transform:rotate(90deg)}
.dot{width:7px;height:7px;border-radius:2px;flex:none;background:var(--t-etc)}
.guides{display:flex;flex:none;align-self:stretch}
.guides i{width:13px;border-left:1px solid var(--line);display:block}

/* ---------- pane ---------- */
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--ground)}
.filehead{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:13px 20px;background:var(--surface);border-bottom:1px solid var(--line);
}
.path{font-family:var(--mono);font-size:13px;color:var(--ink);word-break:break-all;margin-right:auto}
.path .up{color:var(--ink-3)}
.badge{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;flex:none;
  color:var(--tc);background:color-mix(in srgb,var(--tc) var(--tint),transparent);
}
.meta{display:flex;gap:14px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.seg button{background:var(--surface);border:0;padding:4px 11px;font-size:12px;color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.body{flex:1;min-height:0;overflow:auto;padding:0}

/* code view */
.code{font-family:var(--mono);font-size:12.5px;line-height:1.75;padding:14px 0 60px;tab-size:2}
.ln{display:flex;padding:0 20px 0 0}
.ln:hover{background:var(--surface-2)}
.ln .n{
  flex:none;width:56px;padding-right:14px;text-align:right;
  color:var(--ink-3);opacity:.65;user-select:none;font-variant-numeric:tabular-nums;
}
.ln .t{white-space:pre;color:var(--ink)}

/* table view */
.tablewrap{overflow:auto;padding:14px 20px 60px}
table{border-collapse:collapse;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
th,td{
  border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  padding:7px 11px;text-align:left;vertical-align:top;
  min-width:110px;max-width:340px;white-space:pre-wrap;word-break:break-word;
}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
thead th{
  position:sticky;top:0;background:var(--surface-2);color:var(--ink);
  font-weight:700;font-size:11px;letter-spacing:.04em;white-space:nowrap;z-index:1;
  border-bottom:1px solid var(--line-strong);
}
thead th:first-child{min-width:0;width:1px}
td.rn{
  min-width:0;width:1px;
  font-family:var(--mono);color:var(--ink-3);text-align:right;
  font-variant-numeric:tabular-nums;background:var(--surface-2);white-space:nowrap;
}

.notice{padding:40px 24px;color:var(--ink-3);font-size:13px;text-align:center}

/* ---------- intro ---------- */
.intro{padding:34px 26px 70px;max-width:74ch}
.intro h1{font-size:23px;font-weight:700;margin:0 0 6px;text-wrap:balance;letter-spacing:.01em}
.intro .lede{color:var(--ink-2);margin:0 0 26px}
.intro h2{
  font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 12px;
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.ways{display:flex;flex-direction:column;gap:14px}
.way{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.way .k{
  grid-row:span 2;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent-ink);
  font-family:var(--mono);font-size:12px;font-weight:700;
}
.way .t{font-weight:500;align-self:center}
.way .d{color:var(--ink-2);font-size:13px;grid-column:2}
.way code,.intro code{
  font-family:var(--mono);font-size:12px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;
}
.legend{display:flex;flex-wrap:wrap;gap:7px}
.legend span{
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;color:var(--tc);background:color-mix(in srgb,var(--tc) var(--tint),transparent);
}

@media (max-width:820px){
  .shell{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr;overflow:visible}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .tree{max-height:44vh}
  .body{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script type="application/json" id="data">{"branch": "claude/tree-file-view-x2a1jo", "files": [{"path": ".gitignore", "size": 96, "lines": 13, "content": "# Output files\n*.pptx\n\n# Python\n__pycache__/\n*.pyc\n*.pyo\n.venv/\nvenv/\n\n# OS\n.DS_Store\nThumbs.db\n", "binary": false}, {"path": "README.md", "size": 5462, "lines": 126, "content": "# Canva 用スライド素材（CSV → PowerPoint）\n\nウェビナー用のストーリーライン・スライド原稿を **CSV** で管理し、`python-pptx` で **PowerPoint（.pptx）** を生成します。生成したファイルは **Canva にインポート**してデザイン調整する想定です（Canva API は使用しません）。\n\n同じリポジトリの **`web/`** に **Next.js**（App Router・TypeScript・Tailwind CSS・ESLint）を用意しています。ルート直下は既存の CSV / Python と共存させるため、npm の命名規則（フォルダ名に大文字を含むとプロジェクト名に使えない）にも合わせ **`web/` サブフォルダ**に初期化しています。\n\n## Next.js（`web/`）\n\n```powershell\ncd web\nnpm install\nnpm run dev\n```\n\n- 開発サーバー: 通常は [http://localhost:3000](http://localhost:3000)  \n- 本番ビルド: `npm run build` → `npm run start`\n\nソースは `web/app/` 以下（App Router）です。\n\n## 必要な環境\n\n- **Python 3.10 以降**（インストール時に「Add Python to PATH」にチェック推奨）\n- 本リポジトリの `csv_to_pptx.py` と `requirements-pptx.txt`\n\n## セットアップ（初回のみ）\n\nプロジェクトフォルダで:\n\n```powershell\npython -m pip install -r requirements-pptx.txt\n```\n\n依存パッケージは Python の `site-packages` に入ります（このフォルダ直下には置かれません）。\n\n## pptx の生成\n\n### Python から直接\n\n```powershell\npython csv_to_pptx.py -i canva_part16_最幸ママ_bulk_only.csv -o output_part16.pptx --title \"最幸ママ・アカデミー\"\n```\n\n表紙スライドが不要な場合は `--title` を省略します。\n\n```powershell\npython csv_to_pptx.py -i canva_part19_最幸ママ_bulk_only.csv -o output_part19.pptx --title \"最幸ママ・パート19\"\n```\n\n### PowerShell ラッパー\n\n依存関係のインストールと実行をまとめて行う場合:\n\n```powershell\n.\\run_csv_to_pptx.ps1 -InputCsv \".\\canva_part19_最幸ママ_bulk_only.csv\" -Output \".\\output_part19.pptx\" -Title \"最幸ママ・パート19\"\n```\n\n## CSV の列\n\n次の列名を想定しています（`canva_*_bulk_only.csv` と同じ形式）。\n\n| 列名 | 用途の目安 |\n|------|------------|\n| `Headline` | スライドタイトル |\n| `Subheadline` | 本文上部 |\n| `Body` | 本文 |\n| `CTA` | 行動喚起（本文に追記） |\n| `Hook` | フック（本文に追記） |\n| `VisualIdea` | ビジュアル案（本文に追記） |\n\nCSV は **UTF-8**（BOM 可）で保存してください。\n\n## Canva への載せ方\n\n1. Canva で「作成」→「インポート」またはファイルをアップロードし、**.pptx** を読み込む  \n2. 読み込み後、フォント・色・ロゴをブランドに合わせて調整  \n3. 画像・図は `VisualIdea` を参照しながら差し替え\n\n詳しい運用メモは `canva_pptx_README.txt` および `canva_300slides_workflow.txt` を参照してください。\n\n## リポジトリ内の主なファイル\n\n| 種別 | ファイル例 |\n|------|------------|\n| Next.js アプリ | `web/`（`package.json`, `web/app/`） |\n| 生成スクリプト | `csv_to_pptx.py`, `run_csv_to_pptx.ps1` |\n| 依存定義 | `requirements-pptx.txt` |\n| マスター・マッピング | `webinar_slide_map_22rows.csv`, `webinar_22slides_master_spec.txt` |\n| スライドモデル（テキスト） | `webinar_slide_model_*.txt` |\n| 最幸ママ用 CSV | `canva_part16_最幸ママ_bulk_only.csv`, `canva_part19_最幸ママ_bulk_only.csv` など |\n\n生成した **`.pptx` は `.gitignore` で除外**しています（バイナリの肥大化を避けるため）。\n\n### ファイルをツリーで見る\n\nリポジトリの中身をフォルダのツリーで一覧し、そのまま中身も読めるページを用意しています。\n\n- **`tree_view.html`** をブラウザで開くだけです（インターネット接続やサーバは不要）。\n  左のツリーからファイルを選ぶと右に中身が出ます。**CSV は表として**、その他はテキストとして表示します。\n- 内容はリポジトリのスナップショットなので、ファイルを追加・編集したら作り直します。\n\n```powershell\npython tools/build_tree_view.py\n```\n\n`-o` で出力先を変えられます（例: `python tools/build_tree_view.py -o docs/tree.html`）。\n対象は `git ls-files` の結果、つまり **Git 管理下のファイル**だけです。\n\nエディタやコマンドでツリーを見たい場合はこちら。\n\n| 方法 | 手順 |\n|------|------|\n| VS Code | フォルダを開くと左のエクスプローラーがツリーになる（`code .`） |\n| GitHub | リポジトリのページで `t` キー、またはファイル一覧左の «Files» サイドバー |\n| PowerShell | `tree /F` |\n| macOS / Linux | `tree -I \".git\\|node_modules\"` |\n| Git のみ | `git ls-files` |\n\n## トラブルシューティング\n\n- **`python` が認識されない** — PATH を確認するか、[python.org](https://www.python.org/downloads/) の公式インストーラで入れ直す  \n- **文字化け** — CSV を UTF-8 で保存し直す  \n- **`pip` が使えない** — `python -m pip install -r requirements-pptx.txt` を試す\n\n## ライセンス\n\nリポジトリ利用者の判断に委ねます（未設定の場合はリポジトリ所有者の方針に従ってください）。\n", "binary": false}, {"path": "canva_300slides_workflow.txt", "size": 4596, "lines": 72, "content": "================================================================================\n300枚超ウェビナーをCanvaで作る：次にやること（実行順）\n================================================================================\n前提\n  ・「22」はパート（章）の数。実スライド枚数は章ごとに増える。\n  ・Canvaの一括作成は原則「1行＝1デザイン（1枚）」なので、\n    ストーリーライン全体を「スライド単位の行」に分解したCSVが必要。\n\n--------------------------------------------------------------------------------\n1. 列設計を確定する（1行＝1スライド）\n--------------------------------------------------------------------------------\n推奨列（例）:\n  part_no（1～22）\n  slide_seq（そのパート内の通し番号）\n  layout_type（title_only / bullets / two_column / quote / diagram など）\n  Headline または title\n  Body または bullets（改行は \\n で区切る）\n  Subheadline / CTA / Hook / VisualIdea（テンプレに合わせて増減）\n  source_block（元ストーリーのどの段落かメモ）\n\nCanvaテンプレの「データフィールド名」と列名を一致させる。\n\n--------------------------------------------------------------------------------\n2. ストーリーラインを「スライドに割るルール」を決める\n--------------------------------------------------------------------------------\nどれか（または併用）:\n  A. 原稿に「---」や【スライド区切り】を自分で入れる（最も正確）\n  B. 1スライドあたりの最大文字数・最大行数で機械分割（下積み用）\n  C. 論理単位（「なぜなら」1枚、事例1枚 など）をルール化\n\n300枚は手で全部割るのは大変なので、まず B で下書き→人間が A で修正、が現実的。\n\n--------------------------------------------------------------------------------\n3. 分解済みデータをCSVに出力する\n--------------------------------------------------------------------------------\n  ・ゼロライティングファネル.csv / ゆかさん.csv 形式の「長文列」を、\n    上記ルールで複数行に展開した「canva_all_slides.csv」を作る。\n  ・行数＝実スライド枚数（300行なら約300枚）。\n\n--------------------------------------------------------------------------------\n4. Canva側のテンプレを固定する\n--------------------------------------------------------------------------------\n  ・レイアウトは10種類以内に寄せる（増やすほど一括作成の紐づけが重い）。\n  ・「layout_type」列で、どのマスターページを使うかを分ける運用が安定。\n\n--------------------------------------------------------------------------------\n5. 一括作成は分割インポートする\n--------------------------------------------------------------------------------\n  ・300行を一度に読み込むと重い・エラーになることがある。\n  ・50～100行ごとに CSV を分割（part 単位でも可）し、順に Bulk create → 結合。\n\n--------------------------------------------------------------------------------\n6. Canva APIの有無\n---------------------------- 感じやすくなる。\",\"論理の核心へ\",\"家庭の空気が子どもの土台\",\"家の中に「安心」の文字＋小さなアイコン3つ\"\n\"必要なのは「安心できる家庭の空気を作れるママの状態」\",\"そのために「自分を責めない心の状態」をつくる\",\"ママが整うと、無理に頑張らなくても怒りが減り、認められ、子どもも安心する。\",\"メソッド定義へ\",\"原因は子どもではなく、見え方\",\"ママ→家庭→子ども の矢印図（縦）\"\n\"最幸ママ・メソッドとは\",\"『しあわせメガネ』で見える世界を変える\",\"曇ったメガネ（思い込み）を外し、しあわせメガネに掛け替え、定着まで伴走する方法です。\",\"3ステップへ\",\"定義を一言で\",\"メガネのアイコン2つ（曇り／クリア）\"\n\"3つのステップ（目次）\",\"①曇ったメガネに気づく ②しあわせメガネに掛け替える ③定着癒しで最幸親子へ\",\"今かけている思い込みに気づき、思考をリセットし、関わりを脳レベルで定着させます。\",\"各ステップの詳細へ\",\"順番が大事\",\"123の番号バッジ・横並び\"\n\"変化の事例（抜粋）\",\"ビフォーアフターの声\",\"例：イライラ激減・自分を振り返る習慣・子どもの気持ちを考えられるように。\",\"再現性のイメージへ\",\"数字がすべてではないが、道筋はある\",\"吹き出し2〜3個・実名はイニシャル可\"\n\"本編の論理（導入）\",\"whoがwhatになるには、ワンシング＝最幸ママ・メソッドに集中\",\"つい怒るママが、3ヶ月で最幸親子になるには、ママの心を整えることにフォーカスする。\",\"論理展開へ\",\"論理の地図を見せる\",\"who / what / ワンシング の三角形図\"\n\"一枚図：メガネの比喩\",\"同じ行動でも、メガネが違えば見え方が違う\",\"ダメな母親・ちゃんとしなくちゃ…などの思い込みのままだと、子どもの行動が「直さないといけないこと」に見える。\",\"気づきワークへ\",\"見え方が感情をつくる\",\"眼鏡アイコン＋矢印＋言葉の吹き出し\"\n\"思い込みの言い当て\",\"ほめ方・我慢・コントロールでは、根本が動かないことがある\",\"褒めで子どもを動かそうとしたり、手を出しすぎたり、自分を後回しにしたり…。それぞれに落とし穴がある。\",\"落とし穴へ\",\"常識が逆効果になることがある\",\"注意アイコン・短文3つ\"\n\"3つの落とし穴（要約）\",\"①手を出しすぎ ②褒めでコントロール ③自分より子ども優先で心が枯れる\",\"解決の方向：見守り／実況（ジャッジしない）／ママファースト。\",\"解決策の方向へ\",\"99%がつまずく理由を先に言う\",\"3カラム（落とし穴→解決の矢印）\"\n\"なぜ一人では難しいか\",\"無意識の心のメガネで子育てしているから\",\"自分では気づけない前提で、同じ反応を繰り返す。だから「気づき→書き換え→定着」の伴走が効く。\",\"ステップ詳細へ\",\"根本原因はここ\",\"氷山モデル（上：行動／下：無意識）簡易版\"\n\"Step1 心のメガネ発見\",\"イライラの裏にある思考のクセに気づく\",\"最近イライラしたことを書く→感情に気づく→どんなメガネか理解する。\",\"Step2へ\",\"見え方が変われば関わりが変わる\",\"ワークシート風・3つの空欄\"\n\"Step2 思考リセット（しあわせメガネ）\",\"思い込みを書き出し、問い直し、柔らかい考えに置き換える\",\"無理なポジティブではなく、思考が変わると感情反応も変わる。\",\"Step3へ\",\"脳のクセは気づくだけでは足りない\",\"Before/Afterの言葉の置き換え例\"\n\"Step3 定着癒し（最幸親子）\",\"ストレスでも戻らない関わりを、無意識レベルで選べるようにする\",\"成功体験を脳に刻み、安心と信頼のパターンを定着。頑張り続けなくても自然にできるへ。\",\"まとめへ\",\"変化は「意識」だけでは戻る\",\"ループ図・定着のイメージ\"\n\"これがないと…\",\"曇ったメガネのままだと、同じ怒り・同じ自己嫌悪が続く\",\"知識が増えても、心の前提が変わらなければ、現場は変わりにくい。\",\"だからメソッドへ\",\"損失回避で締める\",\"グレー背景＋短い箇条書き3つ\"\n\"今日のまとめ\",\"ママが整うほど、子どもと家庭の空気が整う\",\"3ステップで、見え方→思考→定着まで。最幸親子は「無理のない自然体」から生まれます。\",\" と？\",\"\",\"子どもが心配で、つい手を差し伸べすぎている。ママの都合のいい子にしようとしてしまう（忙しい・回らない悪循環）。\",\"なぜダメ？\",\"\",\"親子の小さなイラスト\"\n\"なぜ最幸親子になれないのか\",\"\",\"「ほめ方を学んでいる」とメソッドを並行しても、手を差し伸べすぎると、子どもの成長のチャンスを奪ってしまうことがある。\",\"解決策へ\",\"\",\"因果の矢印\"\n\"解決策①\",\"\",\"【見守り方を学ぶ】。子どもを信じて待てるようになる。\",\"どう変わる？\",\"\",\"「見守り」キーワード\"\n\"なぜ効くのか\",\"\",\"見守れると、子どもはママの指示ではなく自分の感覚で動ける。自分で体験して「できる」感覚が育つ。\",\"続きへ\",\"\",\"チェックマーク\"\n\"同じ出来事でも…\",\"\",\"意味づけが変わる。感情反応が変わる。子どもへの関わり方が変わる。\",\"落とし穴②へ\",\"\",\"3行箇条書き\"\n\"落とし穴②\",\"\",\"実はそれだけでは足りない。もう一つの原因は【ほめ方を学んでいるから】。\",\"詳しく\",\"\",\"番号バッジ②\"\n\"どういうこと？\",\"\",\"ほめることで、子どもをコントロールしようとしている。\",\"なぜダメ？\",\"\",\"\"\n\"なぜ最幸親子になれないのか\",\"\",\"ほめ方に寄りすぎると、思いどおりに動くことを子どもに求め、自立が遅れることがある。\",\"解決策へ\",\"\",\"\"\n\"解決策②\",\"\",\"【実況アナウンサーになる】。出来事をそのまま言葉にする。目の前の子どもにインタビューする。\",\"なぜ効く？\",\"\",\"マイクの比喩\"\n\"なぜ効くのか\",\"\",\"実況には親の価値観や基準を入れず、子ども自身を大切にできる。ジャッジせず、自主性を守れる。\",\"落とし穴③へ\",\"\",\"\"\n\"落とし穴③（真の原因）\",\"\",\"①②だけでは足りない。真の原因は【自分より子どもを優先しているから】。\",\"詳しく\",\"\",\"番号バッジ③\"\n\"どういうこと？\",\"\",\"ママ自身を後回しにし、子ども優先で、ママの心が満たされない状態になっている。\",\"なぜダメ？\",\"\",\"\"\n\"なぜ最幸親子になれないのか\",\"\",\"自分の心が満たされないと、本当の意味で子どもに愛情を注ぎ続けられない。\",\"解決策へ\",\"\",\"\"\n\"解決策③\",\"\",\"【ママファースト】。自己犠牲をやめ、自分の心の声に耳を傾け、自分をまず大切にする。\",\"なぜ効く？\",\"\",\"ハートのアイコン\"\n\"なぜ効くのか\",\"\",\"ママの心の状態は子どもに直に影響する。ママが心を満たすと、溢れた愛情で子どもも満たせる。\",\"続きへ\",\"\",\"親子の並び\"\n\"どう関わりが変わるか\",\"\",\"ママが心に余裕がある状態で関われると、親子ともに幸せになりやすい。ここまでが「3つの原因と解決策」。\",\"次パートへ\",\"パート16の締め\",\"穏やかな背景\"\n", "binary": false}, {"path": "canva_part16_最幸ママ_分割.csv", "size": 4823, "lines": 23, "content": "part_no,slide_seq,layout_type,Headline,Subheadline,Body,CTA,Hook,VisualIdea,split_rule_note\n16,1,title_body,3つの原因と解決策（導入）,最幸親子になるには,\"「最幸親子」に3ヶ月でなるには「最幸ママ・メソッド（＝ママの心を整える）」すればいい。メソッドとは『しあわせメガネ』で見える世界を変えること。\",次へ,結論から先に言う,メガネのイラスト・暖色,\n16,2,title_body,メソッドで手に入るもの,,「しあわせメガネ」で、親子ともども自然と自己肯定感が高まる「最幸親子」になる状態が手に入る。,続きへ,,同上,\n16,3,bullets,でも待ってください,,ただ単純に「最幸ママ・メソッド」しようとしても、99％の人は失敗してしまう。なぜだと思いますか？,核心へ,期待を一度下げてから本論,ストップサイン・余白多め,\n16,4,title_only,3つの落とし穴,,「最幸ママ・メソッド」には3つの落とし穴がある。ここから説明する。,原因①へ,,数字の「3」大きく,\n16,5,bullets,失敗しやすいのはどんなママ？,,\"つい怒ってしまう悩みがあり、子どもと自分のために成長したい。6歳までのお子さんがいるママが、単純にメソッドだけやろうとすると失敗しやすい。その理由は…\",落とし穴①へ,共感→理由へ,ママのシルエット,\n16,6,section,落とし穴①,,「最幸親子」になりたいのに、できない一つ目の原因は【子どもを守ることを最優先しているから】。,詳しく,,番号バッジ①・赤み,\n16,7,bullets,どういうこと？,,\"子どもが心配で、つい手を差し伸べすぎている。ママの都合のいい子にしようとしてしまう（忙しい・回らない悪循環）。\",なぜダメ？,,親子の小さなイラスト,\n16,8,title_body,なぜ最幸親子になれないのか,,「ほめ方を学んでいる」とメソッドを並行しても、手を差し伸べすぎると、子どもの成長のチャンスを奪ってしまうことがある。,解決策へ,,因果の矢印,\n16,9,title_body,解決策①,,【見守り方を学ぶ】。子どもを信じて待てるようになる。,どう変わる？,,「見守り」キーワード,\n16,10,title_body,なぜ効くのか,,見守れると、子どもはママの指示ではなく自分の感覚で動ける。自分で体験して「できる」感覚が育つ。,続きへ,,チェックマーク,\n16,11,bullets,同じ出来事でも…,,意味づけが変わる。感情反応が変わる。子どもへの関わり方が変わる。,落とし穴②へ,,3行箇条書き,\n16,12,section,落とし穴②,,実はそれだけでは足りない。もう一つの原因は【ほめ方を学んでいるから】。,詳しく,,番号バッジ②,\n16,13,title_body,どういうこと？,,ほめることで、子どもをコントロールしようとしている。,なぜダメ？,,,\n16,14,title_body,なぜ最幸親子になれないのか,,ほめ方に寄りすぎると、思いどおりに動くことを子どもに求め、自立が遅れることがある。,解決策へ,,,\n16,15,title_body,解決策②,,【実況アナウンサーになる】。出来事をそのまま言葉にする。目の前の子どもにインタビューする。,なぜ効く？,,マイクの比喩,\n16,16,title_body,なぜ効くのか,,実況には親の価値観や基準を入れず、子ども自身を大切にできる。ジャッジせず、自主性を守れる。,落とし穴③へ,,,\n16,17,section,落とし穴③（真の原因）,,①②だけでは足りない。真の原因は【自分より子どもを優先しているから】。,詳しく,,番号バッジ③,\n16,18,title_body,どういうこと？,,ママ自身を後回しにし、子ども優先で、ママの心が満たされない状態になっている。,なぜダメ？,,,\n16,19,title_body,なぜ最幸親子になれないのか,,自分の心が満たされないと、本当の意味で子どもに愛情を注ぎ続けられない。,解決策へ,,,\n16,20,title_body,解決策③,,【ママファースト】。自己犠牲をやめ、自分の心の声に耳を傾け、自分をまず大切にする。,なぜ効く？,,ハートのアイコン,\n16,21,title_body,なぜ効くのか,,ママの心の状態は子どもに直に影響する。ママが心を満たすと、溢れた愛情で子どもも満たせる。,続きへ,,親子の並び,\n16,22,title_body,どう関わりが変わるか,,ママが心に余裕がある状態で関われると、親子ともに幸せになりやすい。ここまでが「3つの原因と解決策」。,次パートへ,パート16の締め,穏やかな背景,\n", "binary": false}, {"path": "canva_part19_最幸ママ_bulk_only.csv", "size": 7869, "lines": 55, "content": "\"Headline\",\"Subheadline\",\"Body\",\"CTA\",\"Hook\",\"VisualIdea\"\n\"実践3つのステップ（パート19）\",\"このパートで何が起きるか\",\"曇ったメガネに気づく→しあわせメガネに替える→定着癒しで関わりを無意識レベルまで落とす。3ステップで進む。\",\"Step1へ\",\"具体メソッドの全体像\",\"123のステップ・横並びアイコン\"\n\"Step1のゴール\",\"\",\"「今かけている曇ったメガネに気づく」で、自分がどんな心のメガネで子どもを見ているか気づけるママになる。\",\"事例へ\",\"\",\"ステップバッジ①\"\n\"ビフォーアフター（例）\",\"\",\"娘が自分の気持ちを話すようになった。自分を振り返る習慣ができた（なみこさん）など。\",\"続きへ\",\"\",\"吹き出し1つ\"\n\"感情・生活の変化（例）\",\"\",\"子どもへの爆発的な怒りが激減（ちかさん）。イライラが減少（なみこさん）。\",\"続きへ\",\"\",\"\"\n\"できるようになること（例）\",\"\",\"子どもの気持ちを考えられるようになった（まやさん）。\",\"なぜ最初？\",\"\",\"\"\n\"なぜ最初にこれをやるのか\",\"\",\"見え方が変わらない限り、関わり方は変わらない。\",\"壁へ\",\"\",\"眼鏡の比喩\"\n\"つまずきやすい壁\",\"\",\"自分を責めるだけで、行動を変えられない。\",\"本質へ\",\"\",\"\"\n\"それはなぜか\",\"\",\"曇ったメガネに気づけていないから。\",\"つまり\",\"\",\"\"\n\"つまり\",\"\",\"今の感情や行動は、出来事そのものではなく【見え方】の問題。見え方が変われば感じ方も変わる。\",\"心の準備へ\",\"\",\"\"\n\"心の準備\",\"\",\"「自分が悪い母親だから」と決めつける前に、どんなメガネ（思考のクセ）で見ているか立ち止まって考える。\",\"メソッド名へ\",\"\",\"\"\n\"心のメガネ発見\",\"\",\"具体的に「心のメガネ発見」メソッドを実践する。子どもへの反応の裏にある思考のクセを見つけるワーク。\",\"3つの手順へ\",\"\",\"\"\n\"手順1\",\"\",\"最近、子どもにイライラしたことを書き出す。\",\"手順2へ\",\"\",\"ワークシート欄\"\n\"手順2\",\"\",\"そのとき、心の中にあった思いや感情に気づく。\",\"手順3へ\",\"\",\"\"\n\"手順3\",\"\",\"それらがどんな「心のメガネ」なのか理解する。\",\"メリットへ\",\"\",\"\"\n\"なぜこのメソッドで変われるのか\",\"\",\"説明へ進む：なぜ「冷静に見守れる」につながるか。\",\"続きへ\",\"\",\"\"\n\"3つのメリット\",\"\",\"①思考の癖に気づける ②怒りのスイッチが分かる ③子どもの行動を客観視しやすい。\",\"まとめへ\",\"\",\"箇条書き3つ\"\n\"Step1のまとめ\",\"\",\"この3手順で、子どものことを落ち着いて見守れるママに近づく。\",\"Step2へ\",\"\",\"\"\n\"なぜなら\",\"\",\"怒りは出来事そのものではなく、「見え方」から生まれる。\",\"Step2ゴールへ\",\"\",\"\"\n\"Step2のゴール\",\"\",\"「しあわせメガネに掛け替える」で、怒りを生み出していた思考から解放されたママになる。\",\"事例へ\",\"\",\"ステップバッジ②\"\n\"ビフォーアフター（例）\",\"\",\"物事の捉え方が拡大（翔子さん）。\",\"感情の変化へ\",\"\",\"\"\n\"感情・生活の変化（例）\",\"\",\"爆発が減少（翔子さん）。怒る回数が減少（はるみさん）。\",\"続きへ\",\"\",\"\"\n\"できるようになること（例）\",\"\",\"落ち着いて考えられる（翔子さん）。立ち直りが早くなる（はるみさん）。\",\"なぜ次？\",\"\",\"\"\n\"なぜ次にこれをやるのか\",\"\",\"思考のクセは、気づいただけでは変わらない。\",\"壁へ\",\"\",\"\"\n\"つまずきやすい壁\",\"\",\"無理にポジティブになろうとして逆効果。\",\"本質へ\",\"\",\"\"\n\"それはなぜか\",\"\",\"しあわせメガネへの掛け替えができていないから。\",\"つまり\",\"\",\"\"\n\"つまり\",\"\",\"曇ったメガネ（自分を苦しめる思い込み）を外し、しあわせメガネ＝自然と自分も子どももハッピーにシフトする。\",\"心の準備へ\",\"\",\"\"\n\"心の準備\",\"\",\"「無理にポジティブじゃないと」と自分を追い込まない。関わり方は見方が変われば自然と変わる。\",\"思考リセットへ\",\"\",\"\"\n\"思考リセット\",\"\",\"「思考リセット」メソッドを実践。思い込みを書き換えるワーク。\",\"3手順へ\",\"\",\"\"\n\"思考リセットの定義\",\"\",\"思い込みを書き換える。\",\"手順1へ\",\"\",\"\"\n\"手順1\",\"\",\"思い込みを書き出す。\",\"手順2へ\",\"\",\"\"\n\"手順2\",\"\",\"その思い込みが本当に正しいか問い直す。\",\"手順3へ\",\"\",\"\"\n\"手順3\",\"\",\"より柔らかい考えに置き換える。\",\"メリットへ\",\"\",\"\"\n\"なぜこのメソッドで変われるのか\",\"\",\"感情に振り回されないママへ近づく理由を説明する。\",\"続きへ\",\"\",\"\"\n\"3つのメリット\",\"\",\"①自分を責めにくい ②子どもに完璧を求めにくい ③心に余裕。\",\"まとめへ\",\"\",\"\"\n\"Step2のまとめ\",\"\",\"穏やかに関われるママに近づく。\",\"なぜなら\",\"\",\"\"\n\"なぜなら\",\"\",\"思考が変わると、感情反応も変わる。\",\"Step3ゴールへ\",\"\",\"\"\n\"Step3のゴール\",\"\",\"「最幸親子・定着癒しメソッド」で、子どもの可能性を信じて関われるママになる。\",\"事例へ\",\"\",\"ステップバッジ③\"\n\"ビフォーアフター（例）\",\"\",\"子どもが自発的に動く（ゆきさん）。親子の信頼が戻る（マヨネーズさん）。\",\"続きへ\",\"\",\"\"\n\"感情・生活の変化（例）\",\"\",\"家族がチームになる（まやさん）。\",\"続きへ\",\"\",\"\"\n\"できるようになること（例）\",\"\",\"子どもの立場を考えられる（はるみさん）。自分を大切にできる（ゆきさん）。\",\"なぜ最後？\",\"\",\"\"\n\"なぜ最後にこれをやるのか\",\"\",\"できてもストレスで元の関わり方に戻りやすい。だから定着が要る。\",\"壁へ\",\"\",\"\"\n\"つまずきやすい壁\",\"\",\"「子どもが変わらないと意味がない」。\",\"本質へ\",\"\",\"\"\n\"それはなぜか\",\"\",\"定着癒しができていないから。\",\"つまり\",\"\",\"\"\n\"つまり\",\"\",\"変化の着目を子どもではなく、自分に。正しい関わりを頑張るのではなく、ストレスでも崩れない無意識レベルまで落とす。\",\"心の準備へ\",\"\",\"\"\n\"心の準備\",\"\",\"子どもが変わらないと意味がない、という思い込みをほどく。\",\"定着癒しへ\",\"\",\"\"\n\"【最幸親子】定着癒し\",\"\",\"身につけた関わりを、脳が迷わず選べる状態に。意識しなくても自然にできるようにするワーク。\",\"3手順へ\",\"\",\"\"\n\"定着癒しの定義（要約）\",\"\",\"身につけた関わり方を、神経回路レベルで定着させる。\",\"手順1へ\",\"\",\"\"\n\"手順1\",\"\",\"できた関わりを振り返り、成功体験として脳に刻む。\",\"手順2へ\",\"\",\"\"\n\"手順2\",\"\",\"感情が揺れても崩れない関わりを、日常で再現できるよう脳に定着させる。\",\"手順3へ\",\"\",\"\"\n\"手順3\",\"\",\"親子の間に安心と信頼が自然に流れ、維持する。\",\"メリットへ\",\"\",\"\"\n\"なぜこのメソッドで変われるのか\",\"\",\"子どもへの見方が変われるママになる理由を説明する。\",\"続きへ\",\"\",\"\"\n\"3つのメリット\",\"\",\"①努力なしに良い関わりが選びやすい ②安心と信頼のパターンが定着 ③自己肯定感を高める関わり。\",\"まとめへ\",\"\",\"\"\n\"Step3のまとめ\",\"\",\"子どもの可能性を信じて見守れるママに近づく。\",\"なぜなら\",\"\",\"\"\n\"なぜなら\",\"\",\"意識だけで変わっても、無意識が変わらないと元に戻る。だから定着が要る。\",\"パート終了\",\"\",\"穏やかな締め・余白\"\n", "binary": false}, {"path": "canva_part19_最幸ママ_分割.csv", "size": 9004, "lines": 56, "content": "part_no,slide_seq,layout_type,Headline,Subheadline,Body,CTA,Hook,VisualIdea,split_rule_note\n19,1,title_body,実践3つのステップ（パート19）,このパートで何が起きるか,\"曇ったメガネに気づく→しあわせメガネに替える→定着癒しで関わりを無意識レベルまで落とす。3ステップで進む。\",Step1へ,具体メソッドの全体像,123のステップ・横並びアイコン,原稿「step詳細」冒頭の全体像\n19,2,section,Step1のゴール,,\"「今かけている曇ったメガネに気づく」で、自分がどんな心のメガネで子どもを見ているか気づけるママになる。\",事例へ,,,ステップバッジ①,行96\n19,3,bullets,ビフォーアフター（例）,,\"娘が自分の気持ちを話すようになった。自分を振り返る習慣ができた（なみこさん）など。\",続きへ,,,吹き出し1つ,行97\n19,4,bullets,感情・生活の変化（例）,,\"子どもへの爆発的な怒りが激減（ちかさん）。イライラが減少（なみこさん）。\",続きへ,,,,行98\n19,5,bullets,できるようになること（例）,,\"子どもの気持ちを考えられるようになった（まやさん）。\",なぜ最初？,,,,行99\n19,6,title_body,なぜ最初にこれをやるのか,,\"見え方が変わらない限り、関わり方は変わらない。\",壁へ,,,眼鏡の比喩,行100\n19,7,bullets,つまずきやすい壁,,\"自分を責めるだけで、行動を変えられない。\",本質へ,,,,行101\n19,8,title_body,それはなぜか,,\"曇ったメガネに気づけていないから。\",つまり,,,,行102\n19,9,title_body,つまり,,\"今の感情や行動は、出来事そのものではなく【見え方】の問題。見え方が変われば感じ方も変わる。\",心の準備へ,,,,行103\n19,10,title_body,心の準備,,\"「自分が悪い母親だから」と決めつける前に、どんなメガネ（思考のクセ）で見ているか立ち止まって考える。\",メソッド名へ,,,,行104-105\n19,11,title_body,心のメガネ発見,,\"具体的に「心のメガネ発見」メソッドを実践する。子どもへの反応の裏にある思考のクセを見つけるワーク。\",3つの手順へ,,,,行106-107\n19,12,bullets,手順1,,\"最近、子どもにイライラしたことを書き出す。\",手順2へ,,,ワークシート欄,行108\n19,13,bullets,手順2,,\"そのとき、心の中にあった思いや感情に気づく。\",手順3へ,,,,行109\n19,14,bullets,手順3,,\"それらがどんな「心のメガネ」なのか理解する。\",メリットへ,,,,行110\n19,15,title_body,なぜこのメソッドで変われるのか,,\"説明へ進む：なぜ「冷静に見守れる」につながるか。\",続きへ,,,,行111\n19,16,bullets,3つのメリット,,\"①思考の癖に気づける ②怒りのスイッチが分かる ③子どもの行動を客観視しやすい。\",まとめへ,,,箇条書き3つ,行112\n19,17,title_body,Step1のまとめ,,\"この3手順で、子どものことを落ち着いて見守れるママに近づく。\",Step2へ,,,,行113\n19,18,title_body,なぜなら,,\"怒りは出来事そのものではなく、「見え方」から生まれる。\",Step2ゴールへ,,,,行114\n19,19,section,Step2のゴール,,\"「しあわせメガネに掛け替える」で、怒りを生み出していた思考から解放されたママになる。\",事例へ,,,ステップバッジ②,行115\n19,20,bullets,ビフォーアフター（例）,,\"物事の捉え方が拡大（翔子さん）。\",感情の変化へ,,,,行116\n19,21,bullets,感情・生活の変化（例）,,\"爆発が減少（翔子さん）。怒る回数が減少（はるみさん）。\",続きへ,,,,行117\n19,22,bullets,できるようになること（例）,,\"落ち着いて考えられる（翔子さん）。立ち直りが早くなる（はるみさん）。\",なぜ次？,,,,行118\n19,23,title_body,なぜ次にこれをやるのか,,\"思考のクセは、気づいただけでは変わらない。\",壁へ,,,,行119\n19,24,bullets,つまずきやすい壁,,\"無理にポジティブになろうとして逆効果。\",本質へ,,,,行120\n19,25,title_body,それはなぜか,,\"しあわせメガネへの掛け替えができていないから。\",つまり,,,,行121\n19,26,title_body,つまり,,\"曇ったメガネ（自分を苦しめる思い込み）を外し、しあわせメガネ＝自然と自分も子どももハッピーにシフトする。\",心の準備へ,,,,行122\n19,27,title_body,心の準備,,\"「無理にポジティブじゃないと」と自分を追い込まない。関わり方は見方が変われば自然と変わる。\",思考リセットへ,,,,行123\n19,28,title_body,思考リセット,,\"「思考リセット」メソッドを実践。思い込みを書き換えるワーク。\",3手順へ,,,,行124-125\n19,29,title_body,思考リセットの定義,,\"思い込みを書き換える。\",手順1へ,,,,行125\n19,30,bullets,手順1,,\"思い込みを書き出す。\",手順2へ,,,,行126\n19,31,bullets,手順2,,\"その思い込みが本当に正しいか問い直す。\",手順3へ,,,,行127\n19,32,bullets,手順3,,\"より柔らかい考えに置き換える。\",メリットへ,,,,行128\n19,33,title_body,なぜこのメソッドで変われるのか,,\"感情に振り回されないママへ近づく理由を説明する。\",続きへ,,,,行129\n19,34,bullets,3つのメリット,,\"①自分を責めにくい ②子どもに完璧を求めにくい ③心に余裕。\",まとめへ,,,,行130\n19,35,title_body,Step2のまとめ,,\"穏やかに関われるママに近づく。\",なぜなら,,,,行131\n19,36,title_body,なぜなら,,\"思考が変わると、感情反応も変わる。\",Step3ゴールへ,,,,行132\n19,37,section,Step3のゴール,,\"「最幸親子・定着癒しメソッド」で、子どもの可能性を信じて関われるママになる。\",事例へ,,,ステップバッジ③,行133\n19,38,bullets,ビフォーアフター（例）,,\"子どもが自発的に動く（ゆきさん）。親子の信頼が戻る（マヨネーズさん）。\",続きへ,,,,行134\n19,39,bullets,感情・生活の変化（例）,,\"家族がチームになる（まやさん）。\",続きへ,,,,行135\n19,40,bullets,できるようになること（例）,,\"子どもの立場を考えられる（はるみさん）。自分を大切にできる（ゆきさん）。\",なぜ最後？,,,,行136\n19,41,title_body,なぜ最後にこれをやるのか,,\"できてもストレスで元の関わり方に戻りやすい。だから定着が要る。\",壁へ,,,,行137\n19,42,bullets,つまずきやすい壁,,\"「子どもが変わらないと意味がない」。\",本質へ,,,,行138\n19,43,title_body,それはなぜか,,\"定着癒しができていないから。\",つまり,,,,行139\n19,44,title_body,つまり,,\"変化の着目を子どもではなく、自分に。正しい関わりを頑張るのではなく、ストレスでも崩れない無意識レベルまで落とす。\",心の準備へ,,,,行140-141\n19,45,title_body,心の準備,,\"子どもが変わらないと意味がない、という思い込みをほどく。\",定着癒しへ,,,,行141\n19,46,title_body,【最幸親子】定着癒し,,\"身につけた関わりを、脳が迷わず選べる状態に。意識しなくても自然にできるようにするワーク。\",3手順へ,,,,行142-143要約\n19,47,title_body,定着癒しの定義（要約）,,\"身につけた関わり方を、神経回路レベルで定着させる。\",手順1へ,,,,行143列B\n19,48,bullets,手順1,,\"できた関わりを振り返り、成功体験として脳に刻む。\",手順2へ,,,,行144列B\n19,49,bullets,手順2,,\"感情が揺れても崩れない関わりを、日常で再現できるよう脳に定着させる。\",手順3へ,,,,行145列B\n19,50,bullets,手順3,,\"親子の間に安心と信頼が自然に流れ、維持する。\",メリットへ,,,,行146列B\n19,51,title_body,なぜこのメソッドで変われるのか,,\"子どもへの見方が変われるママになる理由を説明する。\",続きへ,,,,行147列B\n19,52,bullets,3つのメリット,,\"①努力なしに良い関わりが選びやすい ②安心と信頼のパターンが定着 ③自己肯定感を高める関わり。\",まとめへ,,,,行148列B\n19,53,title_body,Step3のまとめ,,\"子どもの可能性を信じて見守れるママに近づく。\",なぜなら,,,,行149列B\n19,54,title_body,なぜなら,,\"意識だけで変わっても、無意識が変わらないと元に戻る。だから定着が要る。\",パート終了,,穏やかな締め・余白,行150列B\n19,55,note,原稿メモ（列3・4）,,\"ゆかさん.csvのstep3付近は、列3（定着癒し系）と列4（しあわせメガネ実践系）が並列。本分割は「列B（2列目）」主軸。別トラックを使う場合は行を複製して差し替え。\",参照,,,,行143-150列C-D\n", "binary": false}, {"path": "canva_pptx_README.txt", "size": 1743, "lines": 38, "content": "================================================================================\nCSV → PowerPoint（pptx）→ Canva：手順\n================================================================================\n\n■ 用意するもの\n  - Python 3.10 以降（インストール時に「Add Python to PATH」にチェック推奨）\n  - 本フォルダの csv_to_pptx.py / requirements-pptx.txt\n\n■ 1回だけ：ライブラリ導入\n  コマンドプロンプトまたは PowerShell で本フォルダへ移動し：\n\n    python -m pip install -r requirements-pptx.txt\n\n■ pptx を作る\n  （Canva用に作った bulk_only CSV を指定）\n\n    python csv_to_pptx.py -i canva_part16_最幸ママ_bulk_only.csv -o output_part16.pptx --title \"最幸ママ・アカデミー\"\n\n  表紙が不要なら --title を省略。\n\n  PowerShell ラッパー例：\n\n    .\\run_csv_to_pptx.ps1 -InputCsv \".\\canva_part19_最幸ママ_bulk_only.csv\" -Output \".\\output_part19.pptx\" -Title \"最幸ママ・パート19\"\n\n■ Canva へ載せる\n  1. Canva で「作成」→「インポート」または「ファイルをアップロード」で pptx を読み込む\n  2. 読み込み後、フォント・色・ロゴをブランドに合わせて一括調整\n  3. 画像・図は VisualIdea 列を見ながら手動で差し込み（または別素材）\n\n■ CSV の列名\n  Headline, Subheadline, Body, CTA, Hook, VisualIdea\n  （canva_*_bulk_only.csv と同じ）\n\n■ トラブル\n  - python が認識されない → PATH を確認するか、Microsoft Store の Python ではなく python.org 版を推奨\n  - 文字化け → CSV を UTF-8（BOM 可）で保存し直す\n\n================================================================================\n", "binary": false}, {"path": "csv_to_pptx.py", "size": 4477, "lines": 147, "content": "# -*- coding: utf-8 -*-\n\"\"\"\nCSV（Headline, Subheadline, Body, CTA, Hook, VisualIdea）から PowerPoint を生成する。\nCanva へは「ファイル → インポート」または pptx をアップロードして編集する想定。\n\n使い方:\n  python csv_to_pptx.py -i canva_part16_最幸ママ_bulk_only.csv -o output.pptx\n  python csv_to_pptx.py -i canva_part19_最幸ママ_bulk_only.csv -o パート19.pptx --title \"最幸ママ・アカデミー\"\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport csv\nimport sys\nfrom io import StringIO\nfrom pathlib import Path\n\nfrom pptx import Presentation\nfrom pptx.util import Pt\nfrom pptx.enum.text import PP_ALIGN\n\n\nEXPECTED_COLUMNS = (\"Headline\", \"Subheadline\", \"Body\", \"CTA\", \"Hook\", \"VisualIdea\")\n\n\ndef read_rows(csv_path: Path) -> list[dict[str, str]]:\n    text = csv_path.read_text(encoding=\"utf-8-sig\")\n    if not text.strip():\n        return []\n    reader = csv.DictReader(StringIO(text))\n    rows = []\n    for row in reader:\n        if row is None:\n            continue\n        cleaned = {k: (v or \"\").strip() for k, v in row.items()}\n        if not any(cleaned.values()):\n            continue\n        rows.append(cleaned)\n    return rows\n\n\ndef build_body_text(row: dict[str, str]) -> str:\n    parts: list[str] = []\n    if row.get(\"Subheadline\"):\n        parts.append(row[\"Subheadline\"])\n    if row.get(\"Body\"):\n        parts.append(row[\"Body\"])\n    extras = []\n    if row.get(\"CTA\"):\n        extras.append(f\"CTA：{row['CTA']}\")\n    if row.get(\"Hook\"):\n        extras.append(f\"Hook：{row['Hook']}\")\n    if row.get(\"VisualIdea\"):\n        extras.append(f\"ビジュアル：{row['VisualIdea']}\")\n    if extras:\n        parts.append(\"\\n\".join(extras))\n    return \"\\n\\n\".join(parts) if parts else \"\"\n\n\ndef set_title_font(title_shape, size_pt: float = 28):\n    if not title_shape.has_text_frame:\n        return\n    for p in title_shape.text_frame.paragraphs:\n        for r in p.runs:\n            r.font.size = Pt(size_pt)\n\n\ndef set_body_font(body_shape, base_pt: float = 18):\n    if not body_shape.has_text_frame:\n        return\n    tf = body_shape.text_frame\n    tf.word_wrap = True\n    for p in tf.paragraphs:\n        for r in p.runs:\n            r.font.size = Pt(base_pt)\n\n\ndef add_content_slide(prs: Presentation, headline: str, body: str):\n    layout = prs.slide_layouts[1]  # Title and Content\n    slide = prs.slides.add_slide(layout)\n    title = slide.shapes.title\n    body_ph = slide.placeholders[1]\n\n    title.text = headline or \"（タイトルなし）\"\n    set_title_font(title, 26)\n\n    tf = body_ph.text_frame\n    tf.clear()\n    p = tf.paragraphs[0]\n    p.text = body or \"\"\n    p.alignment = PP_ALIGN.LEFT\n    set_body_font(body_ph, 16)\n\n    # タイトルが長い場合は少し小さく\n    if headline and len(headline) > 40:\n        set_title_font(title, 22)\n\n\ndef run(input_csv: Path, output_pptx: Path, deck_title: str | None) -> None:\n    rows = read_rows(input_csv)\n    if not rows:\n        print(\"No data rows found in CSV.\", file=sys.stderr)\n        sys.exit(1)\n\n    prs = Presentation()\n\n    # 表紙（任意）\n    if deck_title:\n        title_slide_layout = prs.slide_layouts[0]\n        slide = prs.slides.add_slide(title_slide_layout)\n        slide.shapes.title.text = deck_title\n        if slide.placeholders and len(slide.placeholders) > 1:\n            try:\n                slide.placeholders[1].text_frame.text = input_csv.stem\n            except Exception:\n                pass\n\n    for row in rows:\n        headline = row.get(\"Headline\", \"\")\n        body = build_body_text(row)\n        add_content_slide(prs, headline, body)\n\n    output_pptx.parent.mkdir(parents=True, exist_ok=True)\n    prs.save(str(output_pptx))\n    print(f\"Saved: {output_pptx} ({len(rows)} content slides)\")\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description=\"Build PPTX from Canva-style CSV.\")\n    parser.add_argument(\"-i\", \"--input\", required=True, type=Path, help=\"Input CSV path\")\n    parser.add_argument(\"-o\", \"--output\", required=True, type=Path, help=\"Output .pptx path\")\n    parser.add_argument(\n        \"--title\",\n        default=\"\",\n        help=\"Optional cover slide title (deck title). Empty = no cover slide.\",\n    )\n    args = parser.parse_args()\n\n    if not args.input.is_file():\n        print(f\"Input not found: {args.input}\", file=sys.stderr)\n        sys.exit(1)\n\n    run(args.input, args.output, args.title.strip() or None)\n\n\nif __name__ == \"__main__\":\n    main()\n", "binary": false}, {"path": "generate_copy.ps1", "size": 1599, "lines": 42, "content": "param(\n    [string]$ProductName = \"Product\",\n    [string]$Target = \"Target audience\",\n    [string]$Pain = \"Main pain point\",\n    [string]$Benefit = \"Main benefit\",\n    [string]$Offer = \"Offer\",\n    [string]$Cta = \"CTA\",\n    [string]$Tone = \"Friendly and trustworthy\",\n    [string]$OutputCsv = \"canva_generated_copy.csv\"\n)\n\n$ErrorActionPreference = \"Stop\"\n\n$templatePath = Join-Path $PSScriptRoot \"canva_copy_prompt.txt\"\nif (!(Test-Path $templatePath)) {\n    throw \"Prompt file not found: $templatePath\"\n}\n\n$prompt = Get-Content -Path $templatePath -Raw\n$prompt = $prompt.Replace(\"{商品名}\", $ProductName)\n$prompt = $prompt.Replace(\"{ターゲット}\", $Target)\n$prompt = $prompt.Replace(\"{悩み}\", $Pain)\n$prompt = $prompt.Replace(\"{ベネフィット}\", $Benefit)\n$prompt = $prompt.Replace(\"{オファー}\", $Offer)\n$prompt = $prompt.Replace(\"{CTA}\", $Cta)\n$prompt = $prompt.Replace(\"{トーン}\", $Tone)\n\n# Pass prompt to Claude Code CLI and save CSV\n$csv = & \"$env:USERPROFILE\\.local\\bin\\claude.exe\" --print $prompt\nif ([string]::IsNullOrWhiteSpace($csv)) {\n    throw \"Claude returned empty output.\"\n}\nif ($csv -match \"Not logged in\") {\n    throw \"Claude CLI is not logged in. Run 'claude' once and complete login, then rerun this script.\"\n}\nif ($csv -notmatch \"^\"\"Headline\"\",\"\"Subheadline\"\",\"\"Body\"\",\"\"CTA\"\",\"\"Hook\"\",\"\"VisualIdea\"\"\") {\n    throw \"Claude output is not in expected CSV format. Check your prompt/template.\"\n}\n\n$outPath = Join-Path $PSScriptRoot $OutputCsv\n[System.IO.File]::WriteAllText($outPath, $csv, [System.Text.UTF8Encoding]::new($false))\nWrite-Host \"Generated:\" $outPath\n", "binary": false}, {"path": "requirements-pptx.txt", "size": 20, "lines": 1, "content": "python-pptx>=0.6.21\n", "binary": false}, {"path": "run_csv_to_pptx.ps1", "size": 823, "lines": 26, "content": "# CSV から pptx を生成（Python 3 必須）\nparam(\n    [Parameter(Mandatory = $true)][string]$InputCsv,\n    [Parameter(Mandatory = $true)][string]$Output,\n    [string]$Title = \"\"\n)\n$ErrorActionPreference = \"Stop\"\n$here = Split-Path -Parent $MyInvocation.MyCommand.Path\nSet-Location $here\n\n$python = $null\nforeach ($name in @(\"python\", \"python3\")) {\n    $c = Get-Command $name -ErrorAction SilentlyContinue\n    if ($c) { $python = $name; break }\n}\nif (-not $python) {\n    Write-Error \"Python 3 が PATH にありません。インストール後に再実行してください。\"\n}\n\n& $python -m pip install -q -r (Join-Path $here \"requirements-pptx.txt\")\n$py = Join-Path $here \"csv_to_pptx.py\"\nif ($Title) {\n    & $python $py -i $InputCsv -o $Output --title $Title\n} else {\n    & $python $py -i $InputCsv -o $Output\n}\n", "binary": false}, {"path": "tools/build_tree_view.py", "size": 4278, "lines": 120, "content": "#!/usr/bin/env python3\n\"\"\"リポジトリのファイルをツリー表示する HTML を生成する。\n\n使い方:\n    python tools/build_tree_view.py                 # tree_view.html を出力\n    python tools/build_tree_view.py -o docs/out.html\n\nGit の管理対象ファイル（`git ls-files`）だけを対象にし、テキストファイルは\n中身ごと HTML に埋め込む。生成物は 1 枚の HTML なので、そのままブラウザで開ける。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport subprocess\nimport sys\nfrom pathlib import Path\n\n# 中身を埋め込まない拡張子（バイナリ）\nBINARY_EXT = {\".ico\", \".png\", \".jpg\", \".jpeg\", \".gif\", \".webp\", \".pdf\", \".pptx\", \".xlsx\", \".zip\"}\n# 大きすぎるファイルは先頭だけ埋め込む\nMAX_LINES = 400\nMAX_BYTES = 400_000\n\n\ndef repo_root(start: Path) -> Path:\n    out = subprocess.run(\n        [\"git\", \"rev-parse\", \"--show-toplevel\"],\n        cwd=start, capture_output=True, text=True, check=True,\n    )\n    return Path(out.stdout.strip())\n\n\ndef tracked_files(root: Path) -> list[str]:\n    # -z を使うと日本語などの非 ASCII ファイル名がエスケープされずそのまま出る\n    out = subprocess.run(\n        [\"git\", \"ls-files\", \"-z\"], cwd=root, capture_output=True, check=True\n    )\n    names = out.stdout.decode(\"utf-8\").split(\"\\0\")\n    return sorted(name for name in names if name)\n\n\ndef current_branch(root: Path) -> str:\n    out = subprocess.run(\n        [\"git\", \"rev-parse\", \"--abbrev-ref\", \"HEAD\"],\n        cwd=root, capture_output=True, text=True,\n    )\n    return out.stdout.strip() or \"HEAD\"\n\n\ndef collect(root: Path, paths: list[str], skip: str | None = None) -> list[dict]:\n    files = []\n    for rel in paths:\n        if rel == skip:  # 生成物そのものは埋め込まない\n            continue\n        abs_path = root / rel\n        if not abs_path.is_file():\n            continue\n        size = abs_path.stat().st_size\n        entry: dict = {\"path\": rel, \"size\": size, \"lines\": 0, \"content\": \"\", \"binary\": False}\n\n        if abs_path.suffix.lower() in BINARY_EXT:\n            entry[\"binary\"] = True\n            files.append(entry)\n            continue\n\n        try:\n            text = abs_path.read_text(encoding=\"utf-8\")\n        except UnicodeDecodeError:\n            entry[\"binary\"] = True\n            files.append(entry)\n            continue\n\n        lines = text.splitlines()\n        entry[\"lines\"] = len(lines)\n        if len(lines) > MAX_LINES or size > MAX_BYTES:\n            text = \"\\n\".join(lines[:MAX_LINES])\n            entry[\"truncated\"] = True\n        entry[\"content\"] = text\n        files.append(entry)\n    return files\n\n\ndef build(root: Path, template: Path, skip: str | None = None) -> str:\n    data = {\"branch\": current_branch(root), \"files\": collect(root, tracked_files(root), skip)}\n    payload = json.dumps(data, ensure_ascii=False)\n    # \u003cscript> の中に置くため \"\u003c\" を JSON のユニコードエスケープに逃がす。\n    # これで \"\u003c/script>\" や \"\u003c!--\" がタグとして解釈されることがなくなる。\n    payload = payload.replace(\"\u003c\", \"\\\\u003c\")\n    return template.read_text(encoding=\"utf-8\").replace(\"__FILE_DATA__\", payload)\n\n\ndef main(argv: list[str]) -> int:\n    parser = argparse.ArgumentParser(description=\"リポジトリのファイルツリー HTML を生成します。\")\n    parser.add_argument(\"-o\", \"--output\", default=\"tree_view.html\", help=\"出力先の HTML パス\")\n    args = parser.parse_args(argv)\n\n    here = Path(__file__).resolve().parent\n    root = repo_root(here)\n    template = here / \"tree_view_template.html\"\n    if not template.exists():\n        print(f\"テンプレートが見つかりません: {template}\", file=sys.stderr)\n        return 1\n\n    output = Path(args.output)\n    if not output.is_absolute():\n        output = root / output\n    output.parent.mkdir(parents=True, exist_ok=True)\n    try:\n        skip = output.resolve().relative_to(root).as_posix()\n    except ValueError:\n        skip = None\n    output.write_text(build(root, template, skip), encoding=\"utf-8\")\n    print(f\"生成しました: {output} ({output.stat().st_size:,} バイト)\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main(sys.argv[1:]))\n", "binary": false}, {"path": "tools/tree_view_template.html", "size": 21963, "lines": 482, "content": "\u003ctitle>ウェビナー素材ファイルツリー\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap\">\n\u003cstyle>\n:root{\n  --ink:#141a17; --ink-2:#43514b; --ink-3:#7a8880;\n  --ground:#eff1ed; --surface:#ffffff; --surface-2:#f6f7f4;\n  --line:#dde1da; --line-strong:#c5ccc1;\n  --accent:#0e6b58; --accent-ink:#0b5546; --accent-soft:#dcebe5; --on-accent:#ffffff;\n  --focus:#0e6b58;\n  --t-csv:#a2712b; --t-txt:#5a6b7e; --t-py:#7a4fa0; --t-ps1:#2f6fa8;\n  --t-md:#0e6b58; --t-code:#b4553f; --t-style:#a03e77; --t-img:#4a7a3e; --t-etc:#7a8880;\n  --tint:14%;\n  --sans:\"Zen Kaku Gothic New\",\"Hiragino Sans\",\"Yu Gothic UI\",\"Meiryo\",system-ui,sans-serif;\n  --mono:\"JetBrains Mono\",\"SFMono-Regular\",Menlo,Consolas,\"Noto Sans Mono\",monospace;\n}\n@media (prefers-color-scheme:dark){\n  :root:not /div>\n\n\u003cscript type=\"application/json\" id=\"data\">__FILE_DATA__\u003c/script>\n\u003cscript>\n(function(){\n  \"use strict\";\n  const DATA = JSON.parse(document.getElementById(\"data\").textContent);\n  const FILES = DATA.files;\n  const byPath = new Map(FILES.map(f => [f.path, f]));\n\n  const TYPES = {\n    csv:[\"csv\",\"--t-csv\"], txt:[\"txt\",\"--t-txt\"], py:[\"py\",\"--t-py\"], ps1:[\"ps1\",\"--t-ps1\"],\n    md:[\"md\",\"--t-md\"], ts:[\"ts\",\"--t-code\"], tsx:[\"tsx\",\"--t-code\"], js:[\"js\",\"--t-code\"],\n    mjs:[\"mjs\",\"--t-code\"], json:[\"json\",\"--t-code\"], css:[\"css\",\"--t-style\"],\n    svg:[\"svg\",\"--t-img\"], ico:[\"ico\",\"--t-img\"], gitignore:[\"git\",\"--t-etc\"]\n  };\n  const typeOf = p => {\n    const base = p.split(\"/\").pop();\n    const ext = base.startsWith(\".\") ? base.slice(1) : (base.includes(\".\") ? base.split(\".\").pop().toLowerCase() : \"file\");\n    return TYPES[ext] || [ext.slice(0,4), \"--t-etc\"];\n  };\n  const esc = s => s.replace(/[&\u003c>\"]/g, c => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\n  const kb = n => n \u003c 1024 ? n + \" B\" : (n/1024).toFixed(n \u003c 10240 ? 1 : 0) + \" KB\";\n\n  // ---- store (best effort) ----\n  const store = {\n    get(k,d){ try { const v = localStorage.getItem(\"tv:\"+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },\n    set(k,v){ try { localStorage.setItem(\"tv:\"+k, JSON.stringify(v)); } catch(e){} }\n  };\n\n  // ---- tree model ----\n  const root = { name:\"\", path:\"\", dirs:new Map(), files:[] };\n  for (const f of FILES) {\n    const parts = f.path.split(\"/\");\n    let node = root;\n    for (let i = 0; i \u003c parts.length - 1; i++) {\n      const seg = parts[i], p = parts.slice(0, i+1).join(\"/\");\n      if (!node.dirs.has(seg)) node.dirs.set(seg, { name:seg, path:p, dirs:new Map(), files:[] });\n      node = node.dirs.get(seg);\n    }\n    node.files.push(f);\n  }\n  const countDirs = n => xt/types/**/*.ts\",\n    \".next/dev/types/**/*.ts\",\n    \"**/*.mts\"\n  ],\n  \"exclude\": [\"node_modules\"]\n}\n", "binary": false}, {"path": "webinar_22slides_master_spec.txt", "size": 5986, "lines": 110, "content": "================================================================================\nウェビナースライド 22枚マスター仕様（ユーザー定義）\n================================================================================\n目的: オープニング → コンテンツ → バリュードリブン → CTA の流れで\n      注意・関心 → 常識破壊・現状否定 → 具体教育・欲求 → 申込背中押し を設計する。\n\n--------------------------------------------------------------------------------\nオープニングパート（注意・関心を引くパート）\n--------------------------------------------------------------------------------\n1. 表紙（ウェビナーコンセプト）\n   意味: ウェビナー全体のコンセプトを一枚で伝える表紙。\n\n2. スピーカーズライト（講師実績）\n   意味: 講師の実績をライトに見せ、信頼の土台を作る。\n\n3. 得られる未来（whoが得られるwhat）\n   意味: 誰が（who）、何を得られるか（what）を未来形で提示する。\n\n4. whoのインサイト（悩みの内省・言語化）\n   意味: ターゲットの悩みを、本人の内側の言葉として言語化する。\n\n5. こんな人のためにあります（whoの強化）\n   意味: 「このウェビナーはあなた向け」と who をさらに絞り・強化する。\n\n6. あなたのせいではありません（ライバルを共通の敵化）\n   意味: 視聴者の自己否定を和らげ、対立軸を外部（業界・常識・他者）に置く。\n\n--------------------------------------------------------------------------------\nコンテンツパート（常識を徹底的に壊し「現状がいけません」を教えるパート）\n--------------------------------------------------------------------------------\n7. スピーカーズライト２（講師実績＋経歴）\n   意味: 実績に加え経歴を足し、権威と文脈を補強する。\n\n8. ストーリー（苦難→きっかけ→今の仕事→成功体験）\n   意味: 講師の物語で共感と納得のルートを作る。\n\n9. プレゼント告知（動画を最後まで見た人向け）\n   意味: 視聴完了インセンティブを明示し、離脱を減らす。\n\n10. 目次（1～3）\n    意味: これからの本編の全体像を 1～3 の大項目で示す。\n\n11. サポート実績（ビフォーアフターを数字で）\n    意味: 受講者・顧客の変化を数値で示し、再現性のイメージを持たせる。\n\n12. 目次1\n    意味: 大項目のうち「1本目」の章入り。深掘りの開始。\n\n13. 一枚図（得られる未来図を「欲しい！」が一瞬で生まれるように）\n    意味: 図解で理想の状態を直感的に刺す。\n\n14. 思い込み言い当てと常識外し\n    意味: 視聴者の誤解を言い当て、従来の常識を外す。\n\n15. 時代変化（「時代が変わったので悩みが出てます」を理解させる）\n    意味: 外部要因として市況・時代の変化を説明する。\n\n16. 3つの落とし穴（他のサービスを頼ってもそもそもムリを説明）\n    意味: 他手法・他サービスに頼っても構造的に限界があることを示す。\n\n17. 従来との違い（他のサービス3類型とポートフォリオで説明）\n    意味: 既存の類型と自社の立ち位置を対比し、差別化を明確にする。\n\n18. ある場合とない場合（どれだけ苦労するか・どれだけ楽になるか対比）\n    意味: 手法・状態の有無による損得を対比で見せる。\n\n--------------------------------------------------------------------------------\nバリュードリブンパート（「具体的にこうします」を教育し「欲しい！」を作るパート）\n--------------------------------------------------------------------------------\n19. 実践3つのステップ（「これをします」「なぜ必要か」「こうなります」）\n    意味: 手順を3つに分解し、行動・理由・結果をセットで教える。\n\n20. これがないと（ない場合を説明）\n    意味: 手法や環境がないときのリスク・損失を明示する。\n\n--------------------------------------------------------------------------------\nCTAパート（個別面談申込への背中押しのパート）\n--------------------------------------------------------------------------------\n21. CTA（「こんな未来が手に入ります」を説明）\n    意味: 申込後に得られる未来を具体的に語り、欲求を行動に接続する。\n\n22. 具体的なセッション名（2つの道・有名人の言葉・プレゼント・予約方法）\n    意味: セッション名・選択肢・権威づけ・特典・予約手順まで一気に示し、摩擦を減らす。\n\n================================================================================\nClaude / CSV 用メタ行（任意で先頭行や別シートに）\n================================================================================\npart,slide_no,slide_key,purpose_short\nopening,1,cover,コンセプト提示\nopening,2,speaker_light,講師実績\nopening,3,future_who_what,得られる未来\nopening,4,insight,悩みの言語化\nopening,5,who_for,who強化\nopening,6,not_your_fault,共通の敵\ncontent,7,speaker_light2,実績+経歴\ncontent,8,story,ストーリー\ncontent,9,gift,プレゼント告知\ncontent,10,toc_123,目次1-3\ncontent,11,support_results,数字実績\ncontent,12,toc_1,目次1章\ncontent,13,one_diagram,一枚図\ncontent,14,myth_bust,常識外し\ncontent,15,market_shift,時代変化\ncontent,16,three_pitfalls,落とし穴\ncontent,17,vs_traditional,従来との違い\ncontent,18,with_without,あるなし対比\nvalue,19,three_steps,実践3ステップ\nvalue,20,without_this,これがないと\ncta,21,cta_future,CTA未来\ncta,22,session_detail,セッション具体\n", "binary": false}, {"path": "webinar_master_3slides_template.txt", "size": 3263, "lines": 65, "content": "================================================================================\nマスタースライド（PDF）に基づく ウェビナー冒頭3枚の型\n================================================================================\n使い方: { } を商品・講師情報で置換。Claudeや一括作成CSVの列に割り当て可能。\n\n--------------------------------------------------------------------------------\n1. 表紙（ウェビナーコンセプト）\n--------------------------------------------------------------------------------\n【役割】講座名・サブコピー・数字フックでコンセプトを一発で伝える。\n\n【構成（マスター例）】\n- メインタイトル（大）: {講座名 行1}\n- メインタイトル（続き）: {講座名 行2}\n- サブタイトル（英字風・短いライン）: - {サブコピー英字風} -\n- フック（実績・数字）: \\ {フック一文：広告費・日数・売上 など} /\n\n【文字数目安】\n- 講座名: 1行12〜18文字程度×2行まで\n- フック: 25〜45文字（数字を必ず1つ以上）\n\n--------------------------------------------------------------------------------\n2. スピーカーズライト（講師実績）\n--------------------------------------------------------------------------------\n【役割】講師名と「測れる数字」で信頼。表形式がマスターと一致しやすい。\n\n【上段キャッチ（マスター例）】\n{一言キャッチ：例「たった１つの〇〇で△△する戦略」}\n\n【表：左列ラベル / 右列数値】（必要に応じて行を増減）\n自己紹介 | {講座名・肩書き短く}\n集客期間 | {〇日}\n広告コスト | {〇円}\n新規LINEリスト獲得数 | {〇名}\nCPA（リスト単価） | {〇円}\n個別セッション予約数 | {〇名}\n個別セッション着席単価 | {〇円}\n売上 | {〇円}\nROAS(費用対効果) | {〇%}\n講師名 | {氏名}\n\n【注意】数字は「実績のスナップショット」1セットに揃える（期間と売上の対応を明確に）。\n\n--------------------------------------------------------------------------------\n3. 得られる未来（what）\n--------------------------------------------------------------------------------\n【役割】視聴者の理想状態を問いかけ、本編への橋渡し。\n\n【マスター型（短文・問いかけ）】\n見出し（大）:\nこんなことが\n現実として起こったら\nどうですか？\n\n【差し替えバリエーション例】\n- {理想の状態A} が {期間・条件} で起きたら、どうですか？\n- {悩みの反対語} が当たり前になったら、どうですか？\n\n【文字数目安】見出し3行で完結。各行8〜14文字が読みやすい。\n\n================================================================================\nCSV列の割り当て例（既存 canva_import と併用する場合）\n================================================================================\n- slide_role: cover | speaker | future\n- headline / subheadline / body に上記ブロックを分割して格納\n- VisualIdea: 各スライドの背景・配色の指示（表紙=ブランド色、講師=実績表、未来=余白多め 等）\n", "binary": false}, {"path": "webinar_slide_map_22rows.csv", "size": 5897, "lines": 23, "content": "slide_no,part,slide_name_jp,slide_key,key_message（このスライドで言う一言・要約）,csv_source（ゼロライティングファネル.csvの当て先）,notes\n1,opening,表紙（ウェビナーコンセプト）,cover,\"講座名＋一言フック（ビッグアイデア／whatの核）\",\"列Aラベル「タイトル」「ビッグアイデア」「what（ビッグプロミス）」から表紙用に圧縮\",表紙は文字少なめ。サブは「who」1行に要約しても可\n2,opening,スピーカーズライト（講師実績）,speaker_light,\"数字で信頼 alue,実践3つのステップ（step1〜3の教育）,three_steps,\"各stepで『やること・理由・こうなる』\",\"列「step詳細」（step1〜step3のブロック全体）\",40枚相当の原稿は19で章立てし中身は分割スライド化\n20,value,これがないと,without_this,\"導入しない場合に残るタスクと機会損失\",\"列「step詳細」内の『壁』『思い込み』＋コンテンツロジックの負荷列\",20の後に21CTAで救済\n21,cta,CTA（プログラム提示）,cta_program,\"最短・成果・対象外／対象内\",\"本CSVに21CTA専用行は無し → オファー稿を別途\",プログラム名・期間・条件をCSV行として追加推奨\n22,cta,具体的なセッション名・予約,session_detail,\"セッション名・特典・2つの道・予約\",\"本CSVに22専用行は無し → セッション名・特典・予約導線を別稿\",予約URLは別列で管理すると安全\n", "binary": false}, {"path": "webinar_slide_model_02_speaker_light.txt", "size": 3665, "lines": 73, "content": "ステップ2モデル：スピーカーズライト（講師実績 / 数値で信頼を作る）\n対象PDF: `2講師実績.pdf`（全5ページ）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・講師/提供者の「実績」を一瞬で理解させる（感想ではなく数字）\n・視聴者の疑いを下げ、以降の主張（設計・教育・解決）を受け取りやすくする\n\n----------------------------------------\nこのPDF内の使い分け（ページ抽出メモ）\n----------------------------------------\n1 of 5：最重要ブロック（広告→リスト獲得→予約→売上/ROAS の数値テーブル）\n2 of 5：支援人数/運用実績の“規模”証拠（135名、年商1000万円越え 等）\n3 of 5：課題→導入→結果（ビフォーアフターの矢印）＋追加プロフ（フォロワー17万、治療家/ヘルスコーチ）\n4 of 5：別事例の課題→導入→結果（30リストで面談/販売 等）＋講座名/担当者名\n5 of 5：本PDF上はテキスト抽出が末尾のみ（必要なら次のPDF/別ページでも確認）\n\n----------------------------------------\n必須要素（必ず入れる）\n----------------------------------------\nA. 一言キャッチ（上部）\n　例：`たった１つのファネルで年商1000万円UPする戦略`\n　差し込み：{一言キャッチ}\n\nB. 小見出し（運用実績の導入）\n　例：`自己紹介 / ゼロライティングファネルの運用実績例`\n　差し込み：{運用実績の導入文}\n\nC. 数値テーブル（2列ラベル/値）\n　下記を基本セットとして、値は実績に差し替える\n　差し込み項目：\n　・集客期間：{集客期間}\n　・広告コスト：{広告コスト}\n　・新規LINEリスト獲得数：{LINE獲得数}\n　・CPA（リスト単価）：{CPA}\n　・個別セッション予約数：{予約数}\n　・個別セッション着席単価：{着席単価}\n　・売上：{売上}\n　・ROAS(費用対効果)：{ROAS}\n　・講師名：{氏名}\n\n----------------------------------------\n推奨の“追加モジュール”（入れられるなら強い）\n----------------------------------------\nD. 支援規模（2 of 5 の型）\n　例：`{支援人数} / ゼロイチから年商{目標}越え / 多数のサポート / 講座運営実績`\n　差し込み：{支援人数} {目標}\n\nE. ビフォーアフター矢印（3 or 4 of 5 の型）\n　型：\n　　`{導入前の課題/状態}`\n　　↓\n　　`{ゼロライティングファネルの導入内容/解決の短文}`\n　　{結果数字}（例：単価・売上・面談数などを1〜2個）\n　差し込み：{課題} {導入後の要約} {結果数字}\n\nF. 短い信用ワード（4 of 5 の下部にあるような断片）\n　例：`予約がパンパン / 高額商品が売れてビックリ / 月ベース{数字}円UP …`\n　差し込み：{信用ワード群}\n\n----------------------------------------\nレイアウト指示（Canvaで再現しやすい形）\n----------------------------------------\n・上部：キャッチ（1〜2行）→ 小見出し（1行）\n・中央：数値テーブル（ラベル細字、値太字。値は色を変えると見やすい）\n・下部：追加モジュール（D/Fなら1ブロック、Eなら1事例だけに絞る）\n\n----------------------------------------\nCTAへの接続（このスライドの終わり方）\n----------------------------------------\n・「数字で証明」→次のスライドの“ストーリー/なぜ可能か”に自然につなぐ\n\n", "binary": false}, {"path": "webinar_slide_model_03_future.txt", "size": 3287, "lines": 76, "content": "ステップ3モデル：得られる未来（what / whoが得られる理想）\n対象PDF: `3未来.pdf`（全8ブロック）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・視聴者の「欲しい！」を一瞬で点火する“問いかけ”\n・数字（増加額 / 期間 / 作業ゼロ / 自動化）で現実味を上げる\n・次の“インサイト（なぜそうなるか / どこが原因か）”へ橋渡しする\n\n----------------------------------------\n必須の見出し（PDFにある共通枠）\n----------------------------------------\n見出し（固定）\n「こんなことが\n 現実として起こったら\n どうですか？」\n\n差し込み：この見出しは原則そのまま使用（変更するなら同等の問いかけ文に）\n\n----------------------------------------\n未来ブロック（PDFの各行の“差し込み素材”）\n----------------------------------------\nブロックA（1 of 8）\n「集客にかける手間も時間も1/2以下なのに\n たった一つのファネルで\n 年商が今より{増加額}万円以上増えたら？」\n\nブロックB（2 of 8）\n「面倒でしんどいライティング作業を一切放棄したのに\n 理想のお客様が向こうからくる\n WEBの仕組みが{期間}でできたら？」\n\nブロックC（3 of 8）\n「10万円以下を必死に売るセールスをやめ、\n  {レンジ1}〜{レンジ2}の高額商品が\n 簡単に説明するだけで売れていったら？」\n\nブロックD（4 of 8）\n「書くのが『面倒で難しい』LPが\n 自分で書かずとも完成し100件以上の\n 顧客リストが毎月自動で増えていったら？」\n\nブロックE（5 of 8）\n「SNSやライブ、メルマガ投稿一切やめても\n たった1本の動画で顧客教育が完了し\n 個別面談申し込みが自動で入ったら？」\n\nブロックF（6 of 8）\n「ライティング不要＝自分は一文字も書かずに\n １本の動画だけで集客しつづけ最短{最短期間}で\n 年商1000万円UPを実現していく\n WEBの仕組み構築法が学べます\n 今から始まるこの動画では…」\n\n----------------------------------------\n動画内で“何がわかるか”（7 of 8 の後半）\n----------------------------------------\n続き（PDFの7 of 8）\n「さらに\n リスクは少ないのに強力なレバレッジで\n 『余裕時間×安定収入』の最強2軸をつくる\n ゼロライティングファネルの秘密も公開しています」\n\n----------------------------------------\n実装の指示（Canvaで再現しやすい形）\n----------------------------------------\n・基本は1スライドで「見出し＋未来ブロックを縦に2〜4個」まで\n・数値（{増加額} / {期間} / {最短期間} / {レンジ}）は太字 or 色反転で目立たせる\n・全体のトーンは“煽らず、質問形で淡々と刺激する”\n\n----------------------------------------\nCTAへの接続（このスライドの最後）\n----------------------------------------\n・「学べます」「公開しています」で次の“インサイト（なぜ今までがいけなかったか）”の説明へつなぐ\n\n", "binary": false}, {"path": "webinar_slide_model_04_insight.txt", "size": 3173, "lines": 77, "content": "ステップ4モデル：whoのインサイト（悩みの内省・言語化）\n対象PDF: `4インサイト.pdf`（全10ブロック）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・視聴者に「これ、私のことだ」と思わせる\n・問題の具体描写で共感を作り、次の解決提示を受け取りやすくする\n・不安を煽り切らず、最後に安心へ転換する\n\n----------------------------------------\n構造（このPDFの型）\n----------------------------------------\n1) 問いかけ見出し\n   「こんなことで悩んでませんか？」\n\n2) 悩みの列挙（1 of 10 ～ 7 of 10）\n   ・売上急落、挽回のために複数施策を試しても苦戦\n   ・学んだ通り実行しても申込が入らない\n   ・申込の質が低い（買う気のない層）\n   ・発信作業が重く、継続負荷が高い\n   ・資料/導線作成が難しく、手が止まる\n   ・SNSか交流会かの二択で消耗\n   ・広告外注コストへの恐怖で着手できない\n\n3) 転換フレーズ（8 of 10）\n   「でも / 安心してください」\n\n4) 解決宣言（9～10 of 10）\n   「ゼロライティングファネルなら これらの悩みは まるごと解決できます。」\n\n----------------------------------------\n差し込みテンプレ（そのまま使える雛形）\n----------------------------------------\n見出し:\n「こんなことで悩んでませんか？」\n\n悩みカード1:\n「{売上や集客の急落}…取り戻そうと{施策A}/{施策B}/{施策C}を試しているが、苦戦中…」\n\n悩みカード2:\n「{学んだ通りの実行}をしてるはずなのに、{申込/成約}が入らなくなった…」\n\n悩みカード3:\n「申込が入っても、{理想外の見込み客}ばかりで疲れてしまう…」\n\n悩みカード4:\n「{発信手段}を続けても効果が薄く、終わりが見えずしんどい…」\n\n悩みカード5:\n「{LP/動画/導線}づくりが難しく、結局{書けない/進まない}…」\n\n悩みカード6:\n「{施策A}か{施策B}か頑張るしかないと思うが、どちらも成果が出ない…」\n\n悩みカード7:\n「{広告や外注}に踏み出したいが、{費用や失敗リスク}が怖くて動けない…」\n\n転換:\n「でも、安心してください。」\n\n解決宣言:\n「{メソッド名}なら、これらの悩みはまるごと解決できます。」\n\n----------------------------------------\nレイアウト指示（Canva向け）\n----------------------------------------\n・1枚に詰め込みすぎない。悩みカードは1枚あたり2〜4個推奨\n・悩み文の末尾は「…」で統一し、内省感を出す\n・転換「でも、安心してください。」は余白を広く取り、空気を切り替える\n・解決宣言はブランド色 or 強調色で1行〜2行にまとめる\n\n----------------------------------------\n次スライドへの接続\n----------------------------------------\n・「あなたのせいではない（外部要因）」に接続すると流れが自然\n\n", "binary": false}, {"path": "webinar_slide_model_06_not_your_fault.txt", "size": 2894, "lines": 62, "content": "ステップ6モデル：あなたのせいではありません（共通の敵化）\n対象PDF: `6あなたのせいではありません.pdf`（全2ブロック）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・視聴者の自己否定を外し、心理的防御を下げる\n・問題の原因を「個人能力不足」ではなく「時代遅れの指導構造」に置く\n・この後の新手法提示を受け入れやすくする\n\n----------------------------------------\nこのPDFの構造\n----------------------------------------\n1) 主見出し（免責）\n   「売上の壁を感じているのはあなたのせいではありません」\n\n2) 原因列挙（共通の敵）\n   ・古くなったSNS集客法を知りつつ指導する構造\n   ・長文ライティング時代の成功体験に依存した指導\n   ・難しい作業を教えるだけで実装を受講者任せにする風習\n   ・スキル押し付けと自己責任化（できない方が甘い）\n   ・「ライティングできないと成長できない」という依存構造\n   ・結論：業界風潮が原因\n\n3) 断言（次章への接続）\n   「このウェビナーでお伝えすることは\n     今までのどの集客ノウハウよりも\n     優れたものであることを断言します。」\n\n----------------------------------------\n差し込みテンプレ（使い回し用）\n----------------------------------------\n見出し:\n「{課題名}を感じているのは、あなたのせいではありません」\n\n原因ブロック:\n・{時代遅れの手法A}を、効果が落ちた今も推奨する指導\n・{旧時代の成功体験}を前提にした再現性の低い方法論\n・{難易度の高い作業}だけ教え、実装は受講者任せの構造\n・{特殊スキル}を前提化し、できない人を自己責任化する文化\n・「{思い込み}」を植え付ける依存設計\n・要するに、{業界/市場}の構造的な問題が原因です\n\n断言ブロック:\n「このウェビナーでお伝えすることは、\n 今までのどの{比較対象}よりも\n 優れたものであると断言します。」\n\n----------------------------------------\nレイアウト指示（Canva向け）\n----------------------------------------\n・上部に主見出しを大きく1行〜2行\n・中央は原因を5〜6行の箇条書き（1行あたり短く）\n・下部に断言ブロックを3行で配置し、色で強調\n・語気は強めでも、人格否定ではなく“構造批判”に寄せる\n\n----------------------------------------\n次スライドへの接続\n----------------------------------------\n・「では、何をどう変えるべきか？」の流れで\n  スピーカーズライト2（実績+経歴）やストーリーに接続する\n\n", "binary": false}, {"path": "webinar_slide_model_07_speaker_light2.txt", "size": 2803, "lines": 77, "content": "ステップ7モデル：スピーカーズライト2（講師実績＋経歴）\n対象PDF: `7スピーカーズライト２.pdf`（全2ブロック）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・ステップ2より深い信頼形成（成果の再提示＋人物背景）\n・「この人が言うなら聞く価値がある」を作る\n・ストーリー（ステップ8）への導入を自然にする\n\n----------------------------------------\nこのPDFの構造\n----------------------------------------\n1) 専門性の宣言（肩書き）\n   例: 「ゼロライティングファネル構築の専門家」\n\n2) 自己紹介（氏名）\n   例: 「自己紹介 / 片平誠二郎」\n\n3) 実績ブロック（成果の列挙）\n   ・年商1000万円以上UPの輩出\n   ・月商実績（280万 / 200万 / 100万 など）\n   ・短期成果（7日で11 241, "lines": 59, "content": "ステップ11モデル：サポート実績（ビフォーアフターを数字で）\n対象PDF: `11サポート実績.pdf`（全2ブロック）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・「理論」ではなく「受講生の実例」で再現性を示す\n・広告費・リスト・CPA・予約などのファネル指標で信頼を作る\n・次の内容（目次1 / 一枚図）に入る前に納得感を高める\n\n----------------------------------------\nこのPDFの構造\n----------------------------------------\n1) 導入文\n   「まず、私の受講生さんに起こった出来事をお伝えさせてください。」\n\n2) 事例ラベル\n   ・氏名（例: ケリーさん）\n   ・業種/講座種別（例: セラピスト養成講座ビジネス）\n   ・状態要約（例: 超速収益化ファネルが完成）\n\n3) 指標テーブル（左: 指標 / 右: 数値）\n   ・広告コスト\n   ・新規LINEリスト獲得数\n   ・CPA（リスト単価）\n   ・個別セッション予約数\n   ・個別セッション着席単価\n\n----------------------------------------\n差し込みテンプレ（使い回し用）\n----------------------------------------\n導入:\n「まず、私の受講生さんに起こった出来事をお伝えさせてください。」\n\n事例ヘッダー:\n「{受講生名}　{業種/講座ビジネス}の事例」\n「{状態要約}」\n\n指標:\n・広告コスト: {広告コスト}\n・新規LINEリスト獲得数: {リスト数}\n・CPA（リスト単価）: {CPA}\n・個別セッション予約数: {予約数}\n・個別セッション着席単価: {着席単価}\n\n----------------------------------------\nレイアウト指示（Canva向け）\n----------------------------------------\n・上部: 導入文1〜2行\n・中部: 事例名 + 状態要約\n・下部: 2列テーブル（ラベル細字、数値太字）\n・数字は桁区切りと単位（円/名/%）を統一\n\n----------------------------------------\n次スライドへの接続\n----------------------------------------\n・「この結果が出る理由を、次に構造で説明します」で\n  ステップ12/13へ接続\n\n", "binary": false}, {"path": "webinar_slide_model_13_one_diagram.txt", "size": 3437, "lines": 81, "content": "ステップ13モデル：一枚図（得られる未来図を瞬時に理解させる）\n対象PDF: `13一枚図.pdf`（全4ブロック）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・複雑な集客導線を「一枚で理解」させる\n・視聴者に「これ欲しい」を瞬時に生む\n・従来の努力型と、新方式の省力・高成果型を対比する\n\n----------------------------------------\nこのPDFの構造\n----------------------------------------\n1) 効能の先出し（1 of 4）\n   ・超効率集客\n   ・25時間以内教育\n   ・最短で個別面談到達\n   ・強力システムの開発秘話\n\n2) 断言見出し（2 of 4）\n   「ゼロライティングファネルが現代最強だと断言できる理由」\n\n3) 一枚図本体（3 of 4）\n   ・従来側（SNS/交流会/塾/自助努力/LP/メール/LINE/ライティング）\n   ・新方式側（ヒアリング→商品完成→半自動ファネル→改善）\n   ・結果（高単価成約、待つだけ、ライティング解放、年商UP、時間回復）\n\n4) 定義文（4 of 4）\n   「ライティング丸投げで集客ファネルが完成し、\n     1本動画で理想見込み客の面談予約を入れてくれるファネル」\n\n----------------------------------------\n差し込みテンプレ（使い回し用）\n----------------------------------------\n導入コピー:\n「{メソッド名}で超効率よく集客し、\n 見込み客を{教育時間}以内に教育し\n 最短で{到達地点}までたどり着かせる\n 強力な{システム名}の全体像を公開」\n\n断言見出し:\n「{メソッド名}が現代最強だと断言できる理由」\n\n一枚図（4ステップ）:\n① {起点アクション}（例: プロがヒアリング）\n② {商品/オファー設計}（例: 50〜150万円の商品完成）\n③ {導線構築}（例: 集客ファネルが半自動完成）\n④ {改善ループ}（例: カンタンな改善）\n\n従来比較（任意）:\n「{従来手法A/B/C}に依存し、{負荷/時間}が増える状態」\n  vs\n「{新方式}で、{自動化/省力化/高単価化}が進む状態」\n\n結果キーワード:\n・{結果1}（例: 高単価で成約）\n・{結果2}（例: 待つだけで申込）\n・{結果3}（例: ライティングから解放）\n・{結果4}（例: 年商1000万円UP）\n・{結果5}（例: 時間の犠牲がなくなる）\n\n定義文:\n「{メソッド名}とは、\n {主要負荷を代替する仕組み}で集客導線が完成し、\n {中核コンテンツ}だけで理想見込み客の\n {面談/申込}を生むファネルです。」\n\n----------------------------------------\nレイアウト指示（Canva向け）\n----------------------------------------\n・1枚に要素を詰める場合は「上:断言 / 中央:4ステップ図 / 下:結果キーワード」\n・色分けは2系統（従来=グレー、新方式=ブランド色）\n・矢印と番号を必ず入れて、視線が左→右/上→下に流れるようにする\n・結果キーワードはバッジ化して一瞬で読めるようにする\n\n----------------------------------------\n次スライドへの接続\n----------------------------------------\n・「では、この仕組みがなぜ必要か」を受けて\n  ステップ14（思い込み言い当て・常識外し）へ接続\n\n", "binary": false}, {"path": "webinar_slide_model_14_myth_bust.txt", "size": 4954, "lines": 102, "content": "ステップ14モデル：思い込み言い当てと常識外し（ライティング固定観念を外す）\n対象PDF: `14思い込み言い当てと常識外し.pdf`（全27ブロック相当）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・視聴者の“反論の形”を先回りして、共感から入る\n・「事実は逆」を提示して、従来の常識を壊す\n・なぜ売上が上がらないのかの因果（専門性×本業×構造）を理解させる\n・次の行動（ライティングを手放す）へ自然に橋渡しする\n\n----------------------------------------\nこのPDFの主な流れ（要約）\n----------------------------------------\n1) 反論の代弁（いやいや〜）\n2) 事実の提示（自分で書こうとしていることが売上不振要因）\n3) なぜ不利なのか（ライティングは専門性が高く、集客活動が不利になる）\n4) 理由の深掘り（理解すべき内容が多く複雑／専門職で本業ではない）\n   - 理由一覧（競合リサーチ〜効果測定と改善まで多数）\n   - 「軌道に乗るのは少数派」提示\n5) 解決の方向性（ライティングを手放す：LP/台本/ステップ/LINE/スライドを自分で書かない）\n6) 再反論（でも自分で書かなきゃ…）\n7) 次章への問い（なぜ今ゼロライティングファネルなのか？）\n\n----------------------------------------\nスライド差し込みテンプレ（再現用）\n----------------------------------------\n【入口（反論代弁）】\n「いやいや片平さん、\n {ライティングは大事}と教わって\n {施策A}、{施策B}、{施策C}…\n  頑張って書いてます。\n 起業家なら{ライティングするのが当たり前}じゃないですか？」\n\n【事実（常識外し）】\n「事実は、\n {施策A}、{施策B}、{施策C}…\n を自分で書こうとしていることが\n 売り上げ不振の大きな要因です」\n\n【理由1（専門性が高い）】\n「どういうことかというと、\n {ライティング}自体が専門性の高いスキルなので、\n 自分で書こうとすると{集客活動}が不利になります」\n\n【理由2（理解すべきことが複雑すぎる）】\n「本来、起業家が{ライティング}に手を出してはいけない理由\n  ～理解すべき内容が多くて複雑～」\n（例の一覧は箇条書きで流用可能）\n「・{競合リサーチ} ・{ポジショニング} ・{ペルソナ設定} ・{3C分析} ・{オファー/ベネフィット設計}\n  ・{心理手順} ・{ストーリー/価値教育} ・{効果測定と改善} …」\n\n【理由3（そもそもライターではない＝本業でない）】\n「もう一つの理由：そもそも{ライターではない}専門職だからです」\n「{職種A}/{職種B}/{業種A}/{健康系}/{サロン等}…\n 確かに{できるに越したことない}が、\n {ライティングが本業ではない}ということです」\nアナロジー（家づくり型）\n「大工じゃないのに家を建てるのと一緒。\n  見た目は同じ家に見えても、住めない」\n\n【現象（なぜ上がらないか）】\n「高額起業塾で学んだのに\n  {SNSで反応が取れない}\n  {コンセプトが定まらない}\n  {導線が作れない}\n  {セールスしても決まらない}\n  {登録が増えない}…\n  ライティングを自分でしてることが原因です」\n\n【結論（売上が上がらない）】\n「つまり\n 自分でライティングしている限り\n 売り上げは上がりません」\n「起業塾に行っても\n 軌道に乗るのは{ライティングがうまい少数派}です」\n\n【次アクション（解決法の提示）】\n「では、どうするのがベストな解決法？\n ライティングを手放す。\n ・LPを自分で書かない\n ・ウェビナー動画台本を自分で書かない\n ・ステップメールを自分で書かない\n ・LINEステップを自分で書かない\n ・商品のセールススライドを自分で書かない」\n\n【再反論（自然な疑問の残し）】\n「いや、そうはいっても\n やっぱり自分で書かなきゃ…\n 起業塾でもそう教えられたし…」\n\n【次の問い（章の接続）】\n「では、なぜ今\n {ゼロライティングファネル}なのか？」\n\n----------------------------------------\nレイアウト指示（Canva向け）\n----------------------------------------\n・文字量が多いので、基本は「1スライド=1ブロック」分割が安全\n・大見出しは「事実は逆」「つまり結論」「ライティングを手放す」を目立たせる\n・理由一覧（30項目相当）は本番では全部載せず、\n  「理解すべき内容が多くて複雑」+代表例だけに圧縮して使う\n", "binary": false}, {"path": "webinar_slide_model_15_market_shift.txt", "size": 5949, "lines": 129, "content": "ステップ15モデル：時代変化（「時代が変わったので悩みが出てます」）\n対象PDF: `15時代変化.pdf`（全11ブロック）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・「悩みの原因は本人の努力不足ではない」と外部要因化する\n・市場が変わり、必要な専門性/分業が上がったことを理解させる\n・次の「落とし穴」「従来との違い」へ論理接続する\n\n----------------------------------------\nこのPDFの流れ（要約）\n----------------------------------------\n1) 見出し（なぜ今ゼロライティングファネルなのか？）\n2) 市況変化①（起業家のレベルアップ／熟練化）\n3) コロナ以降→一人起業家増→5年で熟練起業家が成長\n4) 結果：一人起業家に求められる専門ニーズが高くなった\n5) 視聴者の共感問い（昔は自分でライティングが当たり前、今は分業・専門特化）\n6) つまり：より高い専門性を磨き、ハッキリ表現しないと生き残れない\n7) 文脈強化（よりいい技術/驚き→専門化→分業→外注が当たり前）\n8) 事実（売れてる起業家は自分のミッション/得意/本当にやりたいに集中）\n9) 2極化（疲弊層 vs 成長層：ファネル持ち、待つだけ集客、専門スキル集中で時間余る）\n10) 結論：専門分野以外は代行するのが成功の前提\n11) 章接続\n\n----------------------------------------\n差し込みテンプレ（使い回し用）\n----------------------------------------\n見出し（固定寄せ）:\n「では、なぜ今\n {ゼロライティングファネル}なのか？」\n\n市況変化（骨子）:\n・市況変化①：{起業家のレベルアップ}\n・どういうことかというと、\n  {過去→現在の変化（例: コロナ以降一人起業家が大量発生）}\n  → {期間（例: 5年）}が経ち熟練化\n・結果として：{一人起業家が求められる専門ニーズ}が高くなった\n\n共感問い（1文）:\n「{一昔前は当たり前だったこと}だったけど、\n 今活躍してる人ってみな{専門特化/分業}してるよね…」\n\n本質まとめ（1〜2行）:\n「つまり\n {高い専門性}を磨き、\n  {ハッキリ表現}しないと生き残れない\n 世の中に変化しています」\n\n2極化（短文）:\n・疲弊している層：{毎日発信/交流会/コミュニティ/消耗}\n・伸びている層：{ファネル持ち/待つだけ集客/専門スキル集中で時間余る}\n\n結論:\n「つまり\n {専門分野以外は代行}するのが成功のために当たり前になっています」\n\n----------------------------------------\nレイアウト指示（Canva向け）\n----------------------------------------\n・数字/①②③の見出しは大きく\n・「つまり」の行は別色で強調\n・2極化は左右で短い箇条書きにすると視認性が上がる\n\n----------------------------------------\n次スライドへの接続\n----------------------------------------\n・「だからこそ、従来手法の落とし穴が致命傷になります」で\n  ステップ16（3つの落とし穴）へつなぐ\n\n================================================================================\n追補モデル（15-2 時代変化まとめの差し込み要素）\n================================================================================\nこのPDFを見せると、ステップ15の主張が「より断言的」になります。\n\n----------------------------------------\n追加主張（要点）\n----------------------------------------\n・ゼロライティングファネルが必要だと断言できる理由\n・コロナ以降起業が当たり前になった現在の問題\n・起業家レベルアップ問題\n・AI技術格差問題\n・インパクト / インプレッション（問題の軸）\n・専門レベルアップ：専門外は外注化がマスト\n・AIで楽にはなるが、成果が出ない\n・個人でプロ並みのインパクトはもう無理\n\n----------------------------------------\n追加テンプレ（そのまま使える）\n----------------------------------------\n見出し（固定）:\n「ゼロライティングファネルが必要だと断言できる理由」\n\n骨子（3行〜4行でまとめる）:\n「コロナ以降、起業が当たり前になった現在の問題。\n 起業家レベルアップ問題と\n AI技術格差問題が重なり、\n {インパクト/インプレッション}が成立しにくくなっています。」\n\n本質まとめ（1〜2行）:\n「専門レベルが上がった今、\n 専門外は外注化がマスト。\n AIで“楽”になっても“成果”は出ないため、\n 個人でプロ並みのインパクトはもう無理です。」\n\n断言（再掲）:\n「SNS集客や自力集客で年商1000万円UPするには、\n プロ代理構築×超速改善システムの\n ゼロライティングファネル一択です。」\n\n----------------------------------------\n追加の定義文（そのまま再利用OK）\n----------------------------------------\n「ゼロライティングファネルとは、\n LP、ウェビナー台本、メール、LINEファネルに必要な全てのライティングを\n プロが書き上げ、\n 理想のお客様が自然に集まる自動集客の仕組みを\n 2カ月で完成させる方法です。」\n\n----------------------------------------\n追加事例（7日収益化の差し込み）\n----------------------------------------\n・「ケリーさん：現にたったの7日で収益化\n   超速収益化ファネルが完成」\n・指標枠（数値差し込み）:\n  広告コスト / 新規LINEリスト獲得数 / CPA（リスト単価）\n  / 7日間の売上 / 個別セッション着席単価\n\n\n", "binary": false}, {"path": "webinar_slide_model_16_three_pitfalls.txt", "size": 4051, "lines": 85, "content": "ステップ16モデル：3つの落とし穴（他のサービスを頼ってもそもそもムリ）\n対象PDF: `16　3つの落とし穴.pdf`（少なくとも原因①〜解決①が抽出されている）\n\n----------------------------------------\n目的（このスライドで起こすこと）\n----------------------------------------\n・「ゼロライティングファネルを単純に真似しても失敗する理由」を明確化する\n・外部/他社の“発想のズレ”を構造として示す（感情論ではなく）\n・次のステップ17「従来との違い」へ納得接続する\n\n----------------------------------------\nPDF内で読めた範囲（原因①〜解決①）\n----------------------------------------\n【入口（警告）】\n・ゼロライティング・ファネルを構築しようと単純に実行する/プロへ依頼しても\n  99%の人は失敗する\n・なぜだと思いますか？\n\n【落とし穴①】\n・原因①：セールス経験ゼロの人が書いているから\n・どういうことか：50〜150万円の高額商品を作った/売った経験がない人がライティングしている\n・プロライターへ依頼（ココナラ/ランサーズ等）しても、\n  「高額商品を作った/売った経験がない人に設計はムリ」\n\n【結果（何が起きるか）】\n・想像だけで作ったものが出来上がる\n・心をとらえるファネルが完成しない\n・訴求が薄味（USPが刺さらない）\n\n【解決策①】\n・現場で売ってきた人に頼む\n・「売れない悔しさ」を知ってる者にしかファネルは作れない\n・現場のひりひり感がコピーライティングに反映されると、隙のないファネルができる\n・売れた/売れないの経験がないと形通りのコピーしか書けない\n\n【結論（依頼条件）】\n・高額商品を自分で作って、現場で売れなかった悔しさと\n  売れた時の喜びを通じて「どうすれば売れるか」考え抜いた経験が必要\n\n----------------------------------------\n差し込みテンプレ（原因①の使い回し）\n----------------------------------------\n警告（入口）:\n「でも、ちょっと待ってください！\n  ただゼロライティング・ファネルを構築しようと{自分で実行/外注}しても\n  99%の人は失敗します。なぜだと思いますか？」\n\n落とし穴①（原因）:\n「原因①：{セールス経験ゼロ}の人が書いているから」\n\n何がズレるか（説明）:\n「{50〜150万円}の高額商品を作ったことも売ったこともない人が\n ファネル/コピーを設計しているからです」\n\n何が起きるか（症状）:\n・「想像だけで作ったものが出来上がる」\n・「心をとらえるファネルが完成しない」\n・「訴求が薄味になる（強みやUSPが刺さらない）」\n\n解決策①（代替条件）:\n「解決策①：{現場で売ってきた人}に頼む」\n\n解決の理由:\n「売れない悔しさと、売れた時の喜びを知っている人にしか\n  一貫して表現できないからです」\n\n----------------------------------------\n未確定項目（原因②/③）\n----------------------------------------\n
