,,,,,,,\n,\"なぜそう言えるのか？「子供の自己肯定感は親との日常的な関わりの中で作られる。親の心の状態がそのまま子供の自己肯定感となる。」だからです\",\"＊モデリング、愛着形成、情動伝染\n＊親からの声がけではなく、親のやることを見て（親の感情や自己評価）をそのまま真似して育つ\n\",,,,,,,,,,,,,,,,,\n,\"どういうことかというと「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」には「ママが【安心できる家庭の空気】を作れる状態になること」が必要です\",,,,,,,,,,,,,,,,,,\n,\"なぜなら「子供の自己肯定感は、褒められる量ではなく、家庭の安心感の中で育つもの」だからです\",\"＊家庭に、「安心」「受容」「信頼」があることで、子供は自然と「大丈夫」「自分には価値がある」と感じられるようになるから。\",,,,,,,,,,,,,,,,,\n,\"「ママが【安心できる家庭の空気】を作れる状態になる」するには「ママが【自分を責めない心の状態】を作る」することが大事です\",,,,,,,,,,,,,,,,,,\n,\"なぜなら「ママが怒ってしまうのは、愛情が足りないからでもなく、【自己否定】【罪悪感】【焦り】【完璧主義】などにより、常に心が緊張状態になっている」だからです\",\"＊その状態でいくら本やSNSで学んでも、優しくしようと努力しても、脳はストレスモードなので、同じ怒り方を繰り返してしまう、【意志や努力だけでは変わらない領域】\",,,,,,,,,,,,,,,,,\n,\"「ママが【自分を責めない心の状態】を作る」するには「最幸ママ・メソッドをするだけでOK」が必要です\",,,,,,,,,,,,,,,,,,\n,\"なぜなら「最幸ママ・メソッド」をすることで「【ママの思考のクセ】【感情の扱い方】【子供との関わり方】を体系的に整え、ママの心の緊張状態を解き、安心できる家庭の空気を作れるようなる」だからです\",\"＊そうすることで、ママは無理に頑張らなくても、\n・怒る回数が自然と減る\n・子供を認められるようになり\n・子供も安心して自分を表現できるようになる\nつまり、親子ともども自己肯定感が自然と高まる「最幸親子」へ変わっていく\n\",,,,,,,,,,,,,,,,,\n,\"つまり「ついつい子供に怒ってしまうが悩みの、子供と自分のためになるならしっかり成長したい６歳までのお子さんをお持ちのママ」が「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」するには「最幸ママ・メソッドをするだけでOK」が最適な解決策です\",,,,,,,,,,,,,,,,,,\nメソッドの定義,\"「最幸ママ・メソッド」とは「『しあわせメガネ』で見える世界を変える」ことで「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」が手に入ることです\",,,,,,,,,,,,,,,,,,\nhow,「今かけている「曇ったメガネ」に気づく」,\"無意識のうちにママが思っている\n・私はダメな母親\n・ちゃんと育てないと\n・怒ってはいけない\nなどの思い込みのメガネをかけたままだと、子供の行動が。\n・ままを困らせる行動\n・直さないといけないこと\nに見えてしまう。\n自分がどんなメガネで世界を見ているのかをまずは理解する\n\",,,,,,,,,,,,,,,,,\n,「【しあわせメガネ】に掛け替える」,\"イライラの多くは、子供の問題ではなくママの思考のクセから生まれている。\n・完璧主義\n・他者との比較\n・「ちゃんとしなくちゃ」\nなど、親から受け継いだ思考パターンから抜け出す\n\",,,,,,,,,,,,,,,,,\n,「最幸親子『定着癒しメソッド』」,\"子供を信頼して見守れる視点を取り入れる。\nそうすることで、子供の行動が同じでも\n「なんでできないの！」から「今は大切な成長の過程！」と見えるようになり、\nママが頑張らなくても\n・怒る回数が減る\n・子供を認められる\n・子供も安心する\n変化が見られる。\n\",,,,,,,,,,,,,,,,,\nhowのまとめ,\"この３stepで「ついつい子供に怒ってしまうが悩みの、子供と自分のためになるならしっかり成長したい６歳までのお子さんをお持ちのママ」は「自分を責め続けるママの思い込み」を手放して「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」になることができます\",,,,,,,,,,,,,,,,,,\nwhoはどんな試行錯誤や失敗をしてきたか,\"・本で学ぶ（子育ての本、自己肯定感の本、怒らない子育てなど）「子供を褒める」「受け止める」など学び、やってみようと思うけれど、日常の忙しさに振り回されて、「早くして！」「何回言わせるの！」と怒ってしまい、できなかった自分にがっかり。残念、落ち込む。\n・SNSで情報収集（優しいママ、子育て心理学、自己肯定感の育て方など）発信をみて、納得しながらも、自分の子供との生活では同じようにできず「みんなできているのに、私だけダメな母親。、。」と自己否定が強くなる。\n\n・怒らないように努力する。アンガーマネジメントを学んだり「6秒カウント」「深呼吸」「部屋を離れる」「優しく伝える」などやってみようと思うのに、我慢が続かなくて爆発してしまい、自己嫌悪。子供への罪悪感\n・子供を変えようと努力する。「褒める」「キツく叱る」「おやつやご褒美でつる」「ルール作り」などをしてみるが、なかなか子どもが約束を守ってくれないので、結局できずに自己嫌悪。\n\",,,,,,,,,,,,,,,,,,\nwhoがうまくいかないのはどんな壁があったからか,\"・「わかっているけど出来ない」という、その知識ややりたい理想の対応を実行する心の状態が作れていなかったから\n・無意識レベルの思考のクセ\n・感情反応が自動反応として、考える前にやってしまっている。\n\",,,,,,,,,,,,,,,,,,\n\"whoは自分がうまくいかないのは何が原因だと思っているか\",\"・自分の性格のせい「怒りっぽい」「短期」「沸点が低い」から仕方ないと思っている\n・忍耐力、我慢が足りないから\n・子供への愛情不足かもしれない。。。自分は母親としてそもそも欠陥があると思っている\n・子どもがちゃんとやらないから。自分が優しく言っているうちに行動しないせい\n・ベストな方法を知らないせい。知識が足りないから、うちの子にぴったりの方法さえ見つければうまくいくと思っている\n\",,,,,,,,,,,,,,,,,,\nwhoが成果が出ない根本原因はなにか,\"自分では気づけない無意識の心のメガネで子育てをしているから　　自分では気づけない「癒されていない無意識の心」で子育てをしているから\",,,,,,,,,,,,,,,,,,\n３つの原因と解決策,\"「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」には「最幸ママ・メソッドをするだけでOK（＝ママの心を整える）」すればいいんです。「最幸ママ・メソッド」とは「『しあわせメガネ』で見える世界を変える」ことで「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」が手に入ることです」です\",,,,,,,,,,,,,,,,,,\n,\"でもちょっと待ってください。ただ単純に「最幸ママ・メソッド」しようとしても９９％の人は失敗してしまいます。なぜだと思いますか？\",,,,,,,,,,,,,,,,,,\n,\"「最幸ママ・メソッド」するには３つの落とし穴があるんです。今からそれを説明します\",,,,,,,,,,,,,,,,,,\n,\"「ついつい子供に怒ってしまうが悩みの、子供と自分のためになるならしっかり成長したい６歳までのお子さんをお持ちのママ」が単純に「最幸ママ・メソッド」しようとすると失敗するのか、その理由は、、、\",,,,,,,,,,,,,,,,,,\n,\"「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」したくてもできないその一つ目の「【子供を守ることを最優先してるから】」だからです\",,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「子供が心配過ぎてついつい手を指しのべている」ということです\",\"ママの都合のいい行動する子供にしようとしている（一日が回らない、、忙しい、、悪循環、、）\",,,,,,,,,,,,,,,,,\n,\"なぜ「ほめ方を学んでる」と「最幸ママ・メソッド」しようとしても「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」できないのかというと「実は手をさしのべることで子どもが成長するチャンスを奪ってしまっている」からです\",,,,,,,,,,,,,,,,,,\n,\"この問題を解決できるかというと、「【見守り方を学ぶこと】」をすることです\",,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「子どもを信じて待てるようになる」ということです\",,,,,,,,,,,,,,,,,,\n,\"なぜ「【見守り方を学ぶこと】」をすると「【子供を守ることを最優先してる】」が解決できるかというと「子供がママの指示ではなく自分の感覚で動けるようになるから」だからです\",,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「ママが見守れるようになることで、子どもは自分で体験してできるようになる機会を得られ、【自分でできる】感覚が育っていく」からです\",,\"どういうことかというと「同じ出来事でも意味づけが変わる」「感情反応が変わる」「子供への関わり方が変わる」だからです\",,,,,,,,,,,,,,,,\n,\"実はそれだあけではありません。「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」したくてもできないのは「【ほめ方を学んでるから】」からです\",,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「ほめることによって子供をコントロールしようとしている」ということです\n\",,,,,,,,,,,,,,,,,,\n,\"なぜ「【褒め方を学んでいる】」があると「最幸ママ・メソッド」しようとしても「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」できないのかというと「思いどおりに子どもが動くことを子供に求めてるのでいつまでも子どもが自立しない」からです\",,,,,,,,,,,,,,,,,,\n,\"この問題を解決できるかというと、「【実況アナウンサーになる】」をすることです\",,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「出来事をそのまま言葉にしたり、目の前の子どもにインタビューをする」ということです\",,,,,,,,,,,,,,,,,,\n,\"なぜ「【実況アナウンサーになる】」をすると「【褒め方を学んで子どもをコントロールすること】」が解決できるかというと「実況中継には、親の価値観や基準は含まれず、子ども自身を大切にできる」だからです\",,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「親がジャッジすることなく、子ども自身の感覚を大切にするので、子どもをコントロールすることなく子どもの自主性を大切にできるようになる」だからです\",,,,,,,,,,,,,,,,,,\n,\"①②ではまだ解決しきれません。なぜなら真の原因はこれだからです。「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」したくてもできない真の理由は「自分より子供を優先してるから」だからです\",,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「ママ自身のことをいつも後回しにして、子どもを優先させることで、ママの心が満たされない状態になっている」ということです\n\n\",,,,,,,,,,,,,,,,,,\n,\"なぜ「自分より子供を優先してるから」があると「最幸ママ・メソッド」しようとしても「親子ともども自然と自己肯定感が高まる「最幸親子」に3ヶ月でなる」できないのかというと「自分の心が満たされない状態だと、本当の意味で子どもに愛情を注ぎ続けることはできない」だからです\",,,,,,,,,,,,,,,,,,\n,\"この問題を解決できるかというと、「ママファースト」をすることです\",,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「ママが自己犠牲をやめて、自分の心の声に耳を傾けて、自分のことをまず大切にする」ということです\",,,,,,,,,,,,,,,,,,\n,\"なぜ「ママファースト」をすると「自分より子供を優先して心がカラカラ状態」が解決できるかというと「ママの心の状態はダイレクトに子どもの心に影響をするので、ママが自分の心を満たしてあげることで、溢れた愛情で子どもも満たしてあげられる」だからです\",,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「ママがまず心が満たされることでよゆうがある状態で関わることができるので親子共々幸せになれる」だからです\",,,,,,,,,,,,,,,,,,\nstep詳細,\"「step1「今かけている「曇ったメガネ」に気づく」」であなたは「自分がどんな心のメガネで子供を見ているのか気づけるママ」になれます\",,,,,,,,,,,,,,,,,,\n,\"具体的なビフォーアフター「１～２個⇒」・娘が自分の気持ちを話すようになった（　）・自分を振り返る習慣ができた（なみこさん）\",,,,,,,,,,,,,,,,,,\n,\"感情やライフスタイルの変化「１～２個⇒」・子どもへの爆発的な怒りが激減（ちかさん）・イライラが減少（なみこさん）\",,,,,,,,,,,,,,,,,,\n,\"できるようになっていること「１～２個⇒」・子どもの気持ちを考えられるようになった（まやさん）\",,,,,,,,,,,,,,,,,,\n,\"なぜ最初にこれをやるかというと「見え方が変わらない限り、関わり方は変わらない」からです\",,,,,,,,,,,,,,,,,,\n,\"殆どの人は「自分を責めるだけで、行動を変えられない」という壁につまづいています\",,,,,,,,,,,,,,,,,,\n,\"それはこの「step1　今かけている「曇ったメガネ」に気づく」」ができていないからです\",,,,,,,,,,,,,,,,,,\n,\"つまり「今の感情や行動を作ってるのは、ただ【見え方】の問題であり、見え方が変われば感じ方も変わることを知る」する必要があります\",,,,,,,,,,,,,,,,,,\n,\"自分の中にある「自分が悪い母親だから怒ってしまう」という思い込みを見つめなおし、「私はどんなメガネ（思考のクセ）で子供を見ているのか」という心の準備（立ち止まって考えること）が必要なのです\n\",,,,,,,,,,,,,,,,,,\n,\"具体的には「心のメガネ発見」メソッドを実践していきます\",,,,,,,,,,,,,,,,,,\n,\"「心のメガネ発見」メソッドとは「子供への反応の裏にある思考のクセを見つける」をするワークです\",,,,,,,,,,,,,,,,,,\n,\"まず第１のステップとして「最近、子どもにイライラしたことを書き出す」\",,,,,,,,,,,,,,,,,,\n,\"次に第２のステップとして「その時、自分の心の中にあった思いや感情に気づく」\",,,,,,,,,,,,,,,,,,\n,\"３つ目のステップが「それらがどんな「心のメガネ」なのか理解する」\",,,,,,,,,,,,,,,,,,\n,\"ではなぜこの「心のメガネ発見」メソッドをすると「子どもの行動を冷静に見守れる」になれるかということを説明しますね\",,,,,,,,,,,,,,,,,,\n,\"これをすることでこの３つのメリットがあります「１自分の思考の癖に気づける」「２怒りのスイッチを理解できる」「３子どもの行動を客観的に見れる」\",,,,,,,,,,,,,,,,,,\n,\"まとめるとこの３つのステップであなたは「子どものことを落ち着いて見守れるママ」になれます\",,,,,,,,,,,,,,,,,,\n,\"なぜなら「怒りは出来事ではなく、「見え方」から生まれる」からです\",,,,,,,,,,,,,,,,,,\n,\"「step2【しあわせメガネ】に掛け替える」であなたは「怒りを生み出していた思考から解放されたママ」になれます\",,,,,,,,,,,,,,,,,,\n,\"具体的なビフォーアフター「１～２個⇒」・物事の捉え方が拡大（翔子さん）\",,,,,,,,,,,,,,,,,,\n,\"感情やライフスタイルの変化「１～２個⇒」・爆発することが減少（翔子さん）・怒る回数が減少（はるみさん）\",,,,,,,,,,,,,,,,,,\n,\"できるようになっていること「１～２個⇒」・落ち着いて考えられるように（翔子さん）・立ち直りが早くなる（はるみさん）\",,,,,,,,,,,,,,,,,,\n,\"なぜ次にこれをやるかというと「思考のクセは気づいただけでは変わらない」からです\",,,,,,,,,,,,,,,,,,\n,\"殆どの人は「無理やりポジティブになろうとして逆効果」という壁につまづいています\",,,,,,,,,,,,,,,,,,\n,\"それはこの「step2【しあわせメガネ】に掛け替える」ができていないからです\",,,,,,,,,,,,,,,,,,\n,\"つまり「曇ったメガネ＝自分を苦しめている思い込みを外す（捨てる）て、【しあわせメガネ】＝自然と自分も子どももハッピーになれるにシフト」する必要があります\",,,,,,,,,,,,,,,,,,\n,\"自分の中にある「無理やりポジティブにしないといけない」という思い込みを見つめなおし、「関わり方は見方が変われば自然と変わる」という心の準備が必要なのです\",,,,,,,,,,,,,,,,,,\n,\"具体的には「思考リセット」メソッドを実践していきます\",,,,,,,,,,,,,,,,,,\n,\"「思考リセット」メソッドとは「思い込みを書き換える」をするワークです\",,,,,,,,,,,,,,,,,,\n,まず第一のステップとして「思い込みを書き出す」,,,,,,,,,,,,,,,,,,\n,\"次に第２のステップとして「その思い込みが正しいのか問い直す」\",,,,,,,,,,,,,,,,,,\n,３つ目のステップが「より柔軟な考えに置き換える」,,,,,,,,,,,,,,,,,,\n,\"ではなぜこの「思考リセット」メソッドをすると「感情に振り回されないママ」になれるかということを説明しますね\",,,,,,,,,,,,,,,,,,\n,\"これをすることでこの３つのメリットがあります「１自分を責めることが減る」「２子どもに完璧を求めなくなる」「３心の余裕が生まれる」\",,,,,,,,,,,,,,,,,,\n,\"まとめるとこの３つのステップであなたは「子どもに穏やかに関われるママ」になれます\",,,,,,,,,,,,,,,,,,\n,\"なぜなら「思考が変わると感情反応も変わる」だからです\",,,,,,,,,,,,,,,,,,\n,\"「step3　最幸親子『定着癒しメソッド』」であなたは「子どもの可能性を信じて関われるママ」になれます\",,,,,,,,,,,,,,,,,,\n,\"具体的なビフォーアフター「１～２個⇒」・子供が自発的に動くようになった（ゆきさん）・親子の信頼感が戻った（マヨネーズさん）\",,,,,,,,,,,,,,,,,,\n,\"感情やライフスタイルの変化「１～２個⇒」・家族がチームになった（まやさん）\",,,,,,,,,,,,,,,,,,\n,\"できるようになっていること「１～２個⇒」・子どもの立場を考えられる（はるみさん）・自分を大切にできるようになる（ゆきさん）\",,,,,,,,,,,,,,,,,,\n,\"なぜ最後にこれをやるかというと「人はできるようになってもストレスがかかると「元の関わり方」に戻ってしまう」からです\",,,,,,,,,,,,,,,,,,\n,\"殆どの人は「子どもが変わらないと意味がない」という壁につまづいています\",,,,,,,,,,,,,,,,,,\n,\"それはこの「step3　最幸親子『定着癒しメソッド』」ができていないからです\",,,,,,,,,,,,,,,,,,\n,\"つまり「変化の着目するのを子どもではなく、自分に」する必要があります\",,,,,,,,,,,,,,,,,,\n,\"自分の中にある「子どもが変わらないと意味がない」という思い込みを見つめなおし、「正しい関わり方を頑張ってできるのではなく、ストレス状態でも崩れない【無意識レベルで出来る】ようにする」という心の準備が必要なのです\",,,,,,,,,,,,,,,,,,\n,\"具体的には「【最幸親子】定着癒し」メソッドを実践していきます\",,,,,,,,,,,,,,,,,,\n,\"「【最幸親子】定着癒し」メソッドとは「身につけた関わり方を脳が迷わずその関わり方を選ぶ状態にして、意識しなくても自然にできる状態にする」をするワークです\",,\"「しあわせメガネ実践」メソッドとは「子どもの行動の意味を前向きに理解する」をするワークです\",,,,,,,,,,,,,,,,\n,\"まず第一のステップとして「できた関わりを振り返り、成功体験として脳に刻む」\",,\"まず第一のステップとして「子どもの行動の背景を考える」\",,,,,,,,,,,,,,,,\n,\"次に第２のステップとして「感情が揺れる中でも崩れない関わり方を、日常の中で再現できるように脳の神経回路レベルで定着させる」\",,\"次に第２のステップとして「子どもの成長ポイントを見つける」\",,,,,,,,,,,,,,,,\n,\"３つ目のステップが「親子の間に「安心と信頼」が自然に流れる状態を作り、維持する」\",,\"３つ目のステップが「子どもにとって最低限のサポートを提供する」\",,,,,,,,,,,,,,,,\n,\"ではなぜこの「【最幸親子】定着癒し」メソッドをすると「子どもへの見方が変われるママ」になれるかということを説明しますね\",,\"ではなぜこの「しあわせメガネ実践」メソッドをすると「子どもへの見方が変われるママ」になれるかということを説明しますね\",,,,,,,,,,,,,,,,\n,\"これをすることでこの３つのメリットがあります「１良い関わり方を努力をしなくても自然とできる」「２親子の間に安心と信頼のパターンが定着する」「３子どもの自己肯定感を高める関わり方ができる」\",,\"これをすることでこの３つのメリットがあります「１子どもの行動の意味が理解できる」「２子供への感情が穏やかになる」「３子どもの自己肯定感を高める関わり方ができる」\",,,,,,,,,,,,,,,,\n,\"まとめるとこの３つのステップであなたは「子どもの可能性を信じて見守れるママ」になれます\",,\"まとめるとこの３つのステップであなたは「子どもの可能性を信じて見守れるママ」になれます\",,,,,,,,,,,,,,,,\n,\"なぜなら「人は意識で変われても、無意識レベルで変われない限り元に戻ってしまう」だからです\",,\"なぜなら「子どもの行動の見え方が変わると、自然と感情も関わり方も変わる」だからです\",,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n", "binary": false}, {"path": "ゼロライティングファネル.csv", "size": 31181, "lines": 227, "content": "﻿ストーリーライン,,Column 3,Column 4,Column 5,Column 6,Column 7,Column 8,,,,,,,,,,,,\nタイトル,ゼロライティングファネル構築講座,,,,,,,,,,,,,,,,,,\nwho,\"年商300～1500万、起業歴5年以内、WEB/AIオンチで集客に困っていて、SNSとコミュニティ活動ばかりやっている30～50代の一人起業家\n\",,,,,,,,,,,,,,,,,,\nビッグアイデア,SNSやコミュニティ活動をしている起業家はファネル一つ作れば年商1000万UPが可能です,,,,,,,,,,,,,,,,,,\nwhat（ビッグプロミス）,\"SNS投稿なし・交流会なし、ライティングの苦労なしで\n２ヶ月で理想のお客様が来るファネルを手に入れ年商1000万円UPを叶えます。\n\",,,,,,,,,,,,,,,,,,\nワンシング,「ゼロライティング・ファネル」を作るだけでOK,,,,,,,,,,,,,,,,,,\nコンテンツパートのロジック,「who」＝「起業家」がWHAT＝「年商1000万円UPを目指す」にはワンシング＝「ゼロライティング・ファネル」を作ることに集中して」ください,,,,,,,,,,,,,,,,,,\n,なぜこれが必要だと断言できるのか？「年商が1000万円UPの壁を超えられない最大の原因は、「自分でライティングしているから」」だからです,,,,,,,,,,,,,,,,,,\n,なぜそう言えるのか？「「自分で書けば費用が掛からない」と多くの起業家が考えて、LP、ウェビナー台本、メール、LINE全部自分で書いている」からです,,,,,,,,,,,,,,,,,,\n,どういうことかというと「what」＝年商を1000万円UPさせていく年商を1000万円UPさせていくには「A＝LP、ウェビナー台本、メール、LINE、すべてのタッチポイントで見込み客の心を動かすメッセージ」が必要です,,,,,,,,,,,,,,,,,,\n,なぜなら「ファネルは「言葉の連鎖」でできていて、一か所でも言葉が弱ければそこで見込み客が離脱してしまう」からです,,,,,,,,,,,,,,,,,,\n,「すべてのタッチポイントで見込み客の心を動かすメッセージにする」には「膨大な量のライティングをプロ品質で一気通貫に仕上げること」が大事です,,,,,,,,,,,,,,,,,,\n,なぜなら「LPだけ良くてもウェビナーが良くなければ売れない、ウェビナーだけ良くてもLINEが良くなければ売れない、すべてが同じレベルでそろって初めてファネルは機能する」からです,,,,,,,,,,,,,,,,,,\n,「B＝膨大な量のライティングをプロ品質で一気通貫に仕上げる膨大な量のライティングをプロ品質で一気通貫に仕上げる」には「ワンシング＝「ゼロライティング・ファネル」を作ること」が必要です,,,,,,,,,,,,,,,,,,\n,なぜならワンシング＝「ゼロライティング・ファネル」を作ることで「LP、ウェビナー、メール、LINEの全てをプロが代理で書き上げファネルに組み込むところまで丸ごと完成させるので一文字も書く必要がない」からです,,,,,,,,,,,,,,,,,,\n,\"つまり「who＝今まで自分でライティングして空回りしている起業家」が「what＝今から年商1000万円UPするには\n」するには「ワンシング＝「ゼロライティング・ファネル」を作ること」が最適な解決策です\",,,,,,,,,,,,,,,,,,\nメソッドの定義,「ワンシング」とは「LP、ウェビナー台本、メール、LINEとファネルに必要な全てのライティングをプロが書き上げ」ることで「what＝理想のお客様が自然に集まる自動集客の仕組みを２カ月で完成させる方法」が手に入ることです,,,,,,,,,,,,,,,,,,\nhow,step1　ハイバリュー戦略で50～150万円の高単価商品が完成,,,,,,,,,,,,,,,,,,\n,step2　ゼロライティングメソッドで年商1000万円UPする自動集客の仕組みを代理構築,,,,,,,,,,,,,,,,,,\n,step3　超速PDCAメソッドで集客時間1/2＆収入安定し人生充実,,,,,,,,,,,,,,,,,,\nhowのまとめ,この３stepで「who＝SNSばかりやって集客できてない起業家」は「ライティングの苦労を完全に」手放して「what＝自動集客の仕組みを手に入れて年商1000万円UP」することができます,,,,,,,,,,,,,,,,,,\nwhoはどんな試行錯誤や失敗をしてきたか,\"・起業塾で教えられたようにSNS投稿をしているが登録に繋がらない、販売に繋がらない\n・SNS、LINE募集、セミナーセールス、一通り試したが、集客できずお金にならない\n・流行りの集客法には敏感で、起業仲間の情報が気にはなっているが、それが成果になったことがない\n・いつも決まって、リストが増えない、募集が埋まらない、やっとセールスしても売れない、の3重苦がある\n・コミュニティ集客で参加してるが自分は目立たず名刺交換、LINE交換で印象を残せず終わる\",,,,,,,,,,,,,,,,,,\nwhoはどんな苦悩を脳内で抱き反復させてきたか,\"・SNS成果出ないのに続けるのしんどい\n・交流会かSNSかどちらかしかないけどどちらも成果出ない\n・起業塾で学んで言われた通りやってるのに成果出ない\n・広告で事業のばしたいけど月々10万20万もだせない\",,,,,,,,,,,,,,,,,,\nwhoがうまくいかないのはどんな壁があったからか,\"・魅力的なコンセプトを自分では作れない\n・コンセプトを作ってもらったとしてもなぜかSNSでは反応が生まれず、伝え方の壁を感じる\n・自分でLPが書けない、書いても登録が入るような効果性が高い文章が書けない\n・広告が怖くて難しくて事業ステージが次の人のイメージがあり手を付けていない\n・はじめ事業を軌道に乗せるには、SNSをやるしかない、と思い込んでいやいや頑張ってしまっている\n・ライティングがしんどいのでプロのライターに頼むかAIを頼りにするが、余計に成果出ない壁に当たっている\n・最新の集客法に興味があるが結局自分で成果を上げて行くことに難しさと億劫さを感じている\",,,,,,,,,,,,,,,,,,\nwhoは自分がうまくいかないのは何が原因だと思っているか,\"・SNSスキルが向上しないこと\n・交流会で人と会い信頼を得られないこと\n・広告予算がないこと\n・自分の努力や才能が足りないこと\n・実績不足\n\",,,,,,,,,,,,,,,,,,\nwhoが成果が出ない根本原因はなにか,\"・自分の価値を表現しきれてない\n・オファーが弱い\n・顧客にベネフィットを見せれてない\n・広告をやってない\n・ファネルを作る発想がない\n・ライティングを自分でやろうとしてる\n\",,,,,,,,,,,,,,,,,,\n３つの原因と解決策,「what＝年商1000万円UPさせていく年商1000万円UPさせていく」には「ワンシング＝ゼロライティング・ファネルを作」ればいいんです。「ワンシング＝ゼロライティング・ファネル」とは「メソッドの定義＝LP、ウェビナー台本、メール、LINEとファネルに必要な全てのライティングをプロが書き上げ」ることで「what＝理想のお客様が自然に集まる自動集客の仕組みを２カ月で完成させる方法」です,,,,,,,,,,,,,,,,,,\n,でもちょっと待ってください。ただ単純に「ワンシング＝ゼロライティング・ファネルを作ろう」としても９９％の人は失敗してしまいます。なぜだと思いますか？,,,,,,,,,,,,,,,,,,\n,「ワンシング＝ゼロライティング・ファネルを作る」には３つの落とし穴があるんです。今からそれを説明します,,,,,,,,,,,,,,,,,,\n,「who＝SNSばかりやって集客できない起業家」が単純に「ワンシング＝ゼロライティングファネルを作ろう」とすると失敗するのか、その理由は、、、,,,,,,,,,,,,,,,,,,\n,「what＝自動化して年商1000万円UP」したくてもできないその一つ目の「原因①＝セールス経験ゼロの人が書いているから」だからです,,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「５０万円や１００万円する自分の高額商品を販売したことがない人がライティングしている」ということです\n\",,,,,,,,,,,,,,,,,,\n,なぜ「原因①＝セールス経験ゼロの人が書いている」と「ワンシング＝ゼロライティングファネルを構築」しようとしても「what＝年商1000万円UPの壁を超えること」ができないのかというと「高額商品を販売するためのファネルを書くためには、セールスの場に来る前に買いたい気持ちにさせるステップや高くても売れるための条件を理解していることが必要」だからです,,,,,,,,,,,,,,,,,,\n,この問題を解決できるかというと、「解決策①＝現場で売ってきた人に頼む」こと,,,,,,,,,,,,,,,,,,\n,どういうことかというと「実際に高額商品を自分で作り販売した者に依頼をする」ということです,,,,,,,,,,,,,,,,,,\n,なぜ「解決策①＝現場で売ってきた人に頼む現場で売ってきた人に頼む」と「原因①＝セールス経験ゼロの人が書いていることで年商1000万円UPできないこと」が解決できるかというと「「売れない悔しさ」を知ってる者にしかファネルは作れない」からです,,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「高額商品が売れるか売れないかの現場のひりひり感を知らない者に、高額商品のような高い価値のものを一貫して表現できないということです」\n「一方、現場のひりひり感を知っている者がコピーライティングしたときに、隙のないファネルが初めてできます」\n「売れないことによる生活の困窮や、売れたことの大きな喜び、これを経験してないコピーライターは形通りのコピーしか書けません。」\n「つまり、高額商品を自分で作って、現場で売れなかった悔しさと売れた時の喜びを通じ「どうすれば売れるか」考え抜いた経験にある人に依頼することが必要」だからです\",,,,,,,,,,,,,,,,,,\n,実はそれだあけではありません。「what＝年商1000万円UP」したくてもできないのは「原因②＝全体を知らない人に部分だけ頼んでいるから」からです,,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「LP、ウェビナー、メール、LINEまとめて作った経験がない人に「LPだけお願いします」など部分的に頼んでいる」ということです\n\",,,,,,,,,,,,,,,,,,\n,なぜ「原因②＝全体を知らない人に部分だけ頼んでいるから全体を知らない人に部分だけ頼んでいる全体を知らない人に部分だけ頼んでいるから全体を知らない人に部分だけ頼んでいる」と「ワンシング＝ゼロライティングファネルを構築」しようとしても「what＝年商1000万円UP」できないのかというと「本来ファネルを作るために必要なのは、LP、ウェビナー、メール、LINEを視聴者の心が離脱しないようにつなげて設計すること」だからです,,,,,,,,,,,,,,,,,,\n,この問題を解決できるかというと、「解決策②＝ファネル全体を設計できる人に頼むファネル全体を設計できる人に頼む」ことをする,,,,,,,,,,,,,,,,,,\n,どういうことかというと「LP、ウェビナー、メール、LINEをつなげた「売るまでの流れ」が分かっている人に頼む」ということです,,,,,,,,,,,,,,,,,,\n,なぜ「解決策②＝ファネル全体を設計できる人に頼むファネル全体を設計できる人に頼む」と「原因②＝全体を知らない人に部分だけ頼んでいて年商1000万円UPできないこと」が解決できるかというと「消費者の購買意欲を高めるファネルができる」からです,,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「LP、ウェビナー、メール、LINEが繋がると消費者の関心が持続し離脱が起きにくくなるため購買に結びつきやすい、ということです」\n「一般のコピーライターはLPはLP、メールはメール、LINEはLINE、と独立して考えているので、たとえファネルを作ろうと頑張ってライティングしたとしても消費者の購買意欲が途切れるファネルしか作れません」\n「つまり、成果を生むファネルを作るには、LP、ウェビナー、メール、LINEを繋げて一体的に作り成果を上げた人に依頼することが必要」だからです\",,,,,,,,,,,,,,,,,,\n,①②ではまだ解決しきれません。なぜなら真の原因はこれだからです。「what＝年商1000万円UP」したくてもできない真の理由は「原因③＝「作って終わり」の人に頼んでいる」からです,,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「「文章を書くこと」が目的の、成果まで見てもらえない人に頼んでいる」ということです\n\",,,,,,,,,,,,,,,,,,\n,なぜ「原因③＝「作って終わり」の人に頼む」と「ワンシング＝単純にゼロライティングファネル構築」しようとしても「what＝年商1000万円UPにたどり着けないのか？年商1000万円UP」できないのかというと「ライターは成果が上がるかどうかが仕事ではなく、納品することが仕事」だからです,,,,,,,,,,,,,,,,,,\n,この問題を解決できるかというと、「解決策③＝売上を上げれる人に頼む」ことをする,,,,,,,,,,,,,,,,,,\n,どういうことかというと「ファネルをただ作るだけでなく改善と売上UPを含めて作りこめる人に頼む」ということです,,,,,,,,,,,,,,,,,,\n,なぜ「解決策③＝売上を上げれる人に頼む」と「原因③＝作って終りの人に頼んでいた問題」が解決できるかというと「思わず心が動き買いたくなる「成約するファネル」が完成する」からです,,,,,,,,,,,,,,,,,,\n,\"どういうことかというと「売れるまでファネルを改善するプロに仕事を依頼することで、個別面談の予約が自動で入り、セールスが成功し、売上が上がることを前提としたファネル作りができる、ということです」\n「一般のコピーライターにお願いする最大の問題は、「納品形だけ問題」、つまり、「文章を書きましたので納品します」というように、成果が出るかどうかは考慮に入らず納品してそれで終わりという問題です」\n「それはコピーライター側の都合であり、依頼者側としては最も不都合です」\n「つまり、「納品して終わり」のトラブルを未然に防ぐには、はじめから売れることを目的としたファネル作りをする人に書いてもらうことが必要」だからです\",,,,,,,,,,,,,,,,,,\nstep詳細,「step1＝ハイバリュー化戦略で50～150万円の高単価商品が完成」であなたは「50~150万円でも「それ下さい！」とお願いされる「最高の価値」を形にした高単価商品が出来上がり」ます,,,,,,,,,,,,,,,,,,\n,\"具体的なビフォーアフター「１～２個⇒・廃業寸前で高額商品1個も作ったことない状態から５０万円以上の商品ができて初月から売れる\n・5倍の価格にして飛ぶように売れる」\",,,,,,,,,,,,,,,,,,\n,\"感情やライフスタイルの変化「１～２個⇒・価格を5倍にして売れると「自分に価値がある」とセルフイメージが上がり自信がつく\n・100万円以上の商品を作ることで「最高の価値」を認識し、メッセージの力や訴求力が上がる」\",,,,,,,,,,,,,,,,,,\n,できるようになっていること「１～２個⇒・訴求が明確になり、事業にパワーが出る」,,,,,,,,,,,,,,,,,,\n,なぜ最初にこれをやるかというと「スタートがダメだとゴールもダメ。事業者が自分の「価値の最大値」を知らないとすべてが躓いたまま進めてしまう」からです,,,,,,,,,,,,,,,,,,\n,殆どの人は「平凡なまま事業をしてしまうという壁につまずいてしまいます。,,,,,,,,,,,,,,,,,,\n,それはこの「step1＝ハイバリュー化」ができていないからです,,,,,,,,,,,,,,,,,,\n,つまり「「最高の価値」をはっきりと言葉でキャッチコピー化」する必要があります,,,,,,,,,,,,,,,,,,\n,自分の中にある「「自分は平凡」「普通の価値」「業界一なんて恐れ多い」」という思い込みを見つめなおし、「「最高の価値」で「唯一の存在」「この意味合いならNO.1」自分のセルフイメージを再設定する」という心の準備が必要なのです,,,,,,,,,,,,,,,,,,\n,具体的には「ハイバリューワーク」というメソッドを実践していきます,,,,,,,,,,,,,,,,,,\n,「ハイバリューワーク」とは「唯一無二の存在や日本一の存在を決める」ワークです,,,,,,,,,,,,,,,,,,\n,\"まず第１のステップとして「１１の質問シートというものを用いて\n・他社との違い\n・どんな風に成功したいか\n・意外な強み\n・事業の核となるメソッド\n・顧客の最高の姿\nなど計１１個を書いてもらい、ヒアリングさせていただいて、そこから\n・ライバルにできない\n・市場に需要がある\n・スキルとして強い\nこの３つが重なるポイントを見つけます。このステップを踏むことで一人では見逃しがちな強みを見つけ出すことができます。\n」\",,,,,,,,,,,,,,,,,,\n,\"次に第２のステップとして「このポイントで顧客を導く最高形をプロが言語化します。\nこの二つのステップで、一人では難しかった価値最大化＝ハイバリュー化がもれなく叶うので安心して高額商品を設計できる状態になります。」\",,,,,,,,,,,,,,,,,,\n,３つ目のステップが「三つ目のステップとして次は、商品スライドテンプレートに埋めていただくだけで、新しくできたコンセプトで高額商品を売るための商品スライドを代理ライティングしますので自動ででき上がります。」,,,,,,,,,,,,,,,,,,\n,\"ではなぜこの「ハイバリューワーク」メソッドをすると「唯一無二の存在や日本一の存在」になれるかということを説明しますね。これをすることで「例えば、ダイエットだとしたら、ただ痩せるでは売れないので、\n痩せながら自然と引き寄せ体質になる\n「魔法的引き寄せダイエット」\nという風に、このプロセスを踏むと、ただ痩せるだけでなく、「思いのままの人生を送る特別な体験」のような価値提供をできるようになり、唯一無二の、顧客が思わず「ほしい！」となるコンセプト設計が」できるのです\",,,,,,,,,,,,,,,,,,\n,これをすることでこの３つのメリットがあります１「どこにもない存在」２「競合と争わない」３「キャッチ―で覚えてもらえる」,,,,,,,,,,,,,,,,,,\n,まとめるとこの３つのステップであなたは「ハイバリュー化された、50～150万円のコンテンツホルダー」になれます,,,,,,,,,,,,,,,,,,\n,なぜなら「どこにもない存在、どこにもない商品でどうしても解消したいニーズ訴求を覚えてもらえるキャッチ―な状態になれる」からです,,,,,,,,,,,,,,,,,,\n,「step2＝ゼロライティングメソッドで年商1000万円UPする自動集客の仕組みを代理構築」で「一度設置すれば寝ててでも理想のお客様がやってきてセールスの努力なしに半自動で売れていくという状態」になれます,,,,,,,,,,,,,,,,,,\n,\"具体的なビフォーアフター「１～２個⇒・廃業寸前で高額商品1個も作ったことない状態から月商100万円継続\n\n・設置初月から１００万円規模の売上が上がる\n・１年以内に年商１０００万円UPする売り上げ規模になる\n・年商１０００万円UPし自動化の仕組みが構築される」\",,,,,,,,,,,,,,,,,,\n,\"感情やライフスタイルの変化「１～２個⇒・買いたいお客様、少なくとも商品購入に興味関心がある状態で申し込むので、セールスいらずになるので気持ちが楽\n・一度ファネルを設置すると、集客に欠ける時間が消え、すこしの改善で永続的に申し込みが入るので、精神的に解放される\n・SNSの泥沼から抜け出せて、やらなくてよくなる。また、SNSを気持ち的に余裕を持ちながら楽しんで取り組むことができるようになる」\",,,,,,,,,,,,,,,,,,\n,できるようになっていること「１～２個⇒・本来の仕事に集中し、より一層のパフォーマンスを発揮できるようになる」,,,,,,,,,,,,,,,,,,\n,なぜ次にこれをやるかというと「「最高の価値」を言語化したあとそれをWEBにちりばめ一貫性をつくる」からです,,,,,,,,,,,,,,,,,,\n,殆どの人は「コンセプトを作ったとしても「作っただけ」という状態で止まってしまう」という壁につまづいています,,,,,,,,,,,,,,,,,,\n,それはこの「step2＝ゼロライティングファネル」ができていないからです,,,,,,,,,,,,,,,,,,\n,つまり「広告を見たらセールスの場まで一気通貫」する必要があります,,,,,,,,,,,,,,,,,,\n,自分の中にある「50万円以上の商品は作れない、広告はまだ早い、広告は一人でできない、広告会社にお願いするお金が用意できないから広告を始められない、ファネルを一気に作るなんて実績がないとムリ、」という思い込みを見つめなおし、「「瞬で成功する、できる」というマインドセットする」という心の準備が必要なのです,,,,,,,,,,,,,,,,,,\n,具体的には「ゼロライティングファネル構築ヒアリング」メソッドを実践していきます,,,,,,,,,,,,,,,,,,\n,「ゼロライティングファネル構築ヒアリング」メソッドとは「LP、ウェビナー、LINEなどWEBに「最高の価値」をちりばめる」ワークです,,,,,,,,,,,,,,,,,,\n,\"まず第一のステップとして「１６の質問シートというものを用いて\n・顧客がなぜ間違った解決策を選んでしまうのか、その構造的な背景\n・顧客を最高の未来に連れていくたった一つの解決策\n・それにより顧客は何から解放されるか\n・顧客があなたの競合に対して潜在的に抱いてる不満\n等を言語化して、顧客の認知から購買に至るヒーローズジャーニーを一つのウェビナーにまとめます。\nそのウェビナーを見て、行動させるためのLP、メール、LINEの文章が自動で出来上がります。」\",,,,,,,,,,,,,,,,,,\n,次に第２のステップとして「～」,,,,,,,,,,,,,,,,,,\n,３つ目のステップが「～」,,,,,,,,,,,,,,,,,,\n,ではなぜこの「ゼロライティングファネル構築ヒアリング」メソッドをすると「年商1000万円UPを超えていける」かということを説明しますね。「このゼロライティングファネル構築ヒアリングを経て、あなたの顧客があなたのことを選ばざるを得ないストーリーが自動で完成します。そうすると、全く知らない「初めて客」が数時間で興味を持つだけでなく購買意欲が高い状態で申し込み、半ば買う気で面談にやってくる状態を作れるので、年商１０００万円UPします」ということなんです,,,,,,,,,,,,,,,,,,\n,\"これをすることでこの３つのメリットがあります１「✅「手間のかからない自動集客の仕組みが手に入る」\n２✅「誰にもマネされない差別化・独自価値が最大化で50～150万円の商品が売れる」\n３✅「集客に手間をかけずに年商1000万円UPできる」\",,,,,,,,,,,,,,,,,,\n,まとめるとこの３つのステップであなたは「ゼロライティングファネルの所有者になりゆうゆうと年商1000万円UP」できます,,,,,,,,,,,,,,,,,,\n,なぜなら「SNSで影響力が全くなくても50～150万円の高額商品を販売するチャンスが寝ててでも巡ってくるMYファネルを手に入れる」からです,,,,,,,,,,,,,,,,,,\n,「step3＝超速PDCAメソッドで集客時間1/2＆収入安定し人生充実」であなたは「年商1000万円UPだけでなく寝てても申し込みが入り1/2の集客時間、収入は安定し、趣味や家族に時間を割ける、大事な本業に集中できて人生が充実していく人生のステージに入ります。」になれます,,,,,,,,,,,,,,,,,,\n,\"具体的なビフォーアフター「１～２個⇒・全くのゼロから起業して1年後には月商100万円以上稼ぎ世界一のメンターに会いにいったり海外旅行など充実\n・始めフォロワー数千、広告打つけど全く売上にならなかった状態からインスタグラム17万人のインフルエンサーになってSNSで影響力を持ち月100万円以上安定収益化」\",,,,,,,,,,,,,,,,,,\n,\"感情やライフスタイルの変化「１～２個⇒・お金を気にせず趣味、旅行に時間とお金を使える\n・一流のメンターに学びに行くことができる」\",,,,,,,,,,,,,,,,,,\n,\"できるようになっていること「１～２個⇒・広告業者にお願いするよりも安い広告費で運用し、独自で広告効果を上げて行ける最も安定したMYビジネスモデルを形にしている\n・いつまでもSNSの苦痛と不安から逃れられない競合を尻目に、ワンストップ型のMYファネルで50～150万円以上の商品を売るスキルがついている」\",,,,,,,,,,,,,,,,,,\n,なぜ最後にこれをやるかというと「ファネルができて終わりではなく、改善していけばどんどん売上が上がる仕組みが仕上がっていき年商3000万円が自分の工夫で越えられる」からです,,,,,,,,,,,,,,,,,,\n,殆どの人は「数値改善の仕方が分からない」という壁につまづいています,,,,,,,,,,,,,,,,,,\n,それはこの「step3＝広告の超速PDCAがない」ができていないからです,,,,,,,,,,,,,,,,,,\n,つまり「あいまいな感覚ではなく数字で大きなリスクをかけない形で始める」する必要があります,,,,,,,,,,,,,,,,,,\n,自分の中にある「広告は別世界、やるのが難しい、ステージが先」という思い込みを見つめなおし、「もっと簡単に年商1000万円UPを達成し3000万円を目指していいんだ」という心の準備が必要なのです,,,,,,,,,,,,,,,,,,\n,具体的には「超速PDCA」メソッドを実践していきます,,,,,,,,,,,,,,,,,,\n,「超速PDCA」メソッドとは「数値改善、広告やLPの文章をプロの手で手直ししながら超スピードでファネル改善する」をするワークです,,,,,,,,,,,,,,,,,,\n,\"まず第一のステップとして「数値改善４つのポイント①広告②LP③ウェビナー動画④メールとLINEをUTAGEやMETA広告の管理画面で共有し随時ピンポイント改善するメソッドです。\n今まで広告を始めることへのハードルを破壊し、一日５００円から始められる低予算低リスクで、広告効果、LPの登録効果、ウェビナー動画の視聴効果、メールとLINEの誘導効果をオンタイム常時改善します。１日５００円の少ないリスクで始めながら広告を当てて行って予算を次第に増やしていく方法です。」\",,,,,,,,,,,,,,,,,,\n,次に第２のステップとして「～」,,,,,,,,,,,,,,,,,,\n,３つ目のステップが「～」,,,,,,,,,,,,,,,,,,\n,\"ではなぜこの「超速PDCA」メソッドをすると「寝てても申し込みが入り1/2の集客時間、収入は安定し、人生が充実する」かということを説明しますね。「この超速PDCAメソッドによってファネルが一度形になると最小限のチェックと労力で、買う気のある見込み客の申し込みが寝てても入るようになり、50～150万円の高額商品が売れるサイクルが出来上がり」ます\n\",,,,,,,,,,,,,,,,,,\n,\"これをすることでこの３つのメリットがあります１「✅「SNS苦手、WEB苦手、AI苦手、実績なしでも年商1000万円UPが可能」\n２✅「集客に関わる余計な思考を使わずに本業に集中」\n３✅「データが積み上がり年商3000万円や4000万円への道筋ができる」\",,,,,,,,,,,,,,,,,,\n,まとめるとこの３つのステップであなたは「集客時間は半分、データ蓄積で顧客心理をマスターしながら寝ててでも申し込みが入る年商1000万円UP事業者」になれます,,,,,,,,,,,,,,,,,,\n,なぜなら「ライティングアイデアをプロから無限にもらいながら「次これやりましょう」の具体的アクションプランを都度受け取りながら、行動に迷うことなく年商1000万円UPを叶えるゼロライティングファネルが半自動でできる」からです,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n,,,,,,,,,,,,,,,,,,,\n", "binary": false}, {"path": "ゼロライティングファネル_column_design.txt", "size": 5951, "lines": 116, "content": "================================================================================\nゼロライティングファネル.csv 拡張版：列設計（slide_no 付き）\n================================================================================\n目的\n  ・1行＝「スライド1枚の原稿」ではなく、1行＝「ストーリーの1ブロック」\n    のままでも slide_no で「どのスライドに載せるか」を紐づけられるようにする\n  ・同じ slide_no に複数行を付けられる（1枚に箇条書き3つ＝3行）\n  ・スライドに載せない「全体メモ」は slide_no を空欄にする\n\n--------------------------------------------------------------------------------\n推奨：列の並び（左から）\n--------------------------------------------------------------------------------\n1. slide_no\n2. slide_sub_no\n3. part\n4. block_id\n5. row_label\n6. body\n7. slide_role_hint\n8. visual_hint\n9. status\n10. memo\n\n（既存の Column 3〜8 の空列は、Excel 互換のため残してもよいが、\n  運用では上記に寄せると管理しやすい）\n\n--------------------------------------------------------------------------------\n各列の意味・入力ルール\n--------------------------------------------------------------------------------\n\n■ slide_no（必須に近い）\n  ・スライド番号。ウェビナー22枚仕様に合わせて 1 ～ 22 の整数\n  ・「まだ割り当てていない」「全体設計メモ」は空欄または 0\n  ・1枚のスライドに複数ブロックを載せる場合、同じ slide_no を複数行に付ける\n\n■ slide_sub_no（任意・推奨）\n  ・同一 slide_no 内の表示順。1, 2, 3…\n  ・1行で1枚に収まる場合は 1 のみでよい\n\n■ part（任意・推奨）\n  ・ opening | content | value | cta\n  ・ webinar_22slides_master_spec と整合。フィルタに使う\n\n■ block_id（任意）\n  ・論理ブロックの識別子。例：\n    meta_title / who_profile / big_idea / what_promise / onesing\n    logic_chain / method_def / how_steps / how_summary\n    who_trials / who_pain / who_walls / who_self_blame / who_root_cause\n    pitfalls / step1_detail / step2_detail / step3_detail\n  ・同一長文を複数スライドに分割したとき、親子関係をメモできる\n\n■ row_label（必須）\n  ・現行の列A相当。「タイトル」「who」「コンテンツパートのロジック」など\n  ・空行で続きの段落だけある行は、前行と同じ block の続きとして\n    row_label を「コンテンツパートのロジック（続き）」のように区別してもよい\n\n■ body（必須）\n  ・現行の列B相当。本文・箇条書き・長文ロジックの本体\n\n■ slide_role_hint（任意）\n  ・その行がスライド上で担う役割の短いメモ\n  ・例：見出しのみ / 箇条書き / 図のキャプション / 注意書き\n  ・webinar_slide_map_22rows.csv の slide_key と揃えてもよい\n    （cover / speaker_light / future_who_what / …）\n\n■ visual_hint（任意）\n  ・Canva 用：写真・図・表・2カラム比較 などの指示を短く\n\n■ status（任意）\n  ・ draft | fix | done\n  ・または レビュー待ち など日本語でも可\n\n■ memo（任意）\n  ・出典PDF名、マスタースライド番号、推敲メモ\n\n--------------------------------------------------------------------------------\nslide_no の付け方（運用ルール）\n--------------------------------------------------------------------------------\n\n1. まず「1行＝1スライド」に無理にしない。\n   長い「コンテンツパートのロジック」は、\n   論理の区切りごとに行を分け、それぞれに slide_no を振る\n   （例：12→14→16 にまたがるなら、行ごとに 12, 13, 14 または 14,14,16 など設計に合わせる）\n\n2. webinar_slide_map_22rows.csv の対応表を「正」とし、\n   不足しているスライド（講師数値・プレゼント・時代変化など）は\n   ・新しい行を body ごと追加する\n   ・または slide_no だけ先に振って body は後から埋める\n   のどちらかでよい\n\n3. 同じ slide_no が10行以上になる場合は、\n   そのスライドを「複数枚に分割」するか、\n   「一覧スライド＋詳細は配布資料」に逃がすかを決める\n\n--------------------------------------------------------------------------------\n拡張版の1行サンプル（イメージ）\n--------------------------------------------------------------------------------\n\nslide_no | slide_sub_no | part    | block_id   | row_label | body（要約）                    | ...\n---------+--------------+---------+------------+-----------+--------------------------------+----\n1        | 1            | opening | meta_title | タイトル  | ゼロライティングファネル構築講座 | ...\n1        | 2            | opening | big_idea   | ビッグアイデア | SNSやコミュニティ…        | ...\n3        | 1            | opening | what       | what      | SNS投稿なし・交流会なし…      | ...\n\n--------------------------------------------------------------------------------\n既存 CSV からの移行手順（短く）\n--------------------------------------------------------------------------------\n\n1. 現ファイルをコピーして ゼロライティングファネル_v2.csv を作る\n2. 左端に列を挿入し、上記の列名を1行目に追加\n3. webinar_slide_map_22rows.csv を見ながら、行ごとに slide_no を埋める\n4. 空欄だった「2,8,9,15,17,21,22」用の行を新規追加する\n\n================================================================================\nこのファイルは列設計の説明のみ。実データの複製はユーザー作業または別依頼で行う。\n================================================================================\n", "binary": false}]}</script>
<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const FILES = DATA.files;
  const byPath = new Map(FILES.map(f => [f.path, f]));

  const TYPES = {
    csv:["csv","--t-csv"], txt:["txt","--t-txt"], py:["py","--t-py"], ps1:["ps1","--t-ps1"],
    md:["md","--t-md"], ts:["ts","--t-code"], tsx:["tsx","--t-code"], js:["js","--t-code"],
    mjs:["mjs","--t-code"], json:["json","--t-code"], css:["css","--t-style"],
    svg:["svg","--t-img"], ico:["ico","--t-img"], gitignore:["git","--t-etc"]
  };
  const typeOf = p => {
    const base = p.split("/").pop();
    const ext = base.startsWith(".") ? base.slice(1) : (base.includes(".") ? base.split(".").pop().toLowerCase() : "file");
    return TYPES[ext] || [ext.slice(0,4), "--t-etc"];
  };
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const kb = n => n < 1024 ? n + " B" : (n/1024).toFixed(n < 10240 ? 1 : 0) + " KB";

  // ---- store (best effort) ----
  const store = {
    get(k,d){ try { const v = localStorage.getItem("tv:"+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
    set(k,v){ try { localStorage.setItem("tv:"+k, JSON.stringify(v)); } catch(e){} }
  };

  // ---- tree model ----
  const root = { name:"", path:"", dirs:new Map(), files:[] };
  for (const f of FILES) {
    const parts = f.path.split("/");
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      const seg = parts[i], p = parts.slice(0, i+1).join("/");
      if (!node.dirs.has(seg)) node.dirs.set(seg, { name:seg, path:p, dirs:new Map(), files:[] });
      node = node.dirs.get(seg);
    }
    node.files.push(f);
  }
  const countDirs = n => [...n.dirs.values()].reduce((a,d) => a + 1 + countDirs(d), 0);

  let expanded = new Set(store.get("expanded", ["web"]));
  let selected = store.get("selected", null);
  if (!byPath.has(selected)) selected = null;
  let filter = "";

  // ---- rail render ----
  const treeEl = document.getElementById("tree");

  function matches(f){ return !filter || f.path.toLowerCase().includes(filter); }

  function dirHasMatch(node){
    return node.files.some(matches) || [...node.dirs.values()].some(dirHasMatch);
  }

  function guides(depth){
    return depth ? '<span class="guides">' + '<i></i>'.repeat(depth) + "</span>" : "";
  }

  function renderNode(node, depth, out){
    for (const d of [...node.dirs.values()].sort((a,b) => a.name.localeCompare(b.name))) {
      if (filter && !dirHasMatch(d)) continue;
      const open = filter ? true : expanded.has(d.path);
      out.push(
        '<button class="row dir" data-dir="' + esc(d.path) + '" aria-expanded="' + open + '">' +
        guides(depth) +
        '<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2.5 8 6l-4 3.5"/></svg>' +
        '<span class="name">' + esc(d.name) + "</span>" +
        '<span class="sz">' + (d.files.length + countDirs(d)) + "</span></button>"
      );
      if (open) renderNode(d, depth + 1, out);
    }
    for (const f of node.files.slice().sort((a,b) => a.path.localeCompare(b.path))) {
      if (!matches(f)) continue;
      const [, tok] = typeOf(f.path);
      out.push(
        '<button class="row" data-file="' + esc(f.path) + '" aria-current="' + (f.path === selected) + '">' +
        guides(depth) +
        '<span class="dot" style="background:var(' + tok + ')"></span>' +
        '<span class="name">' + esc(f.path.split("/").pop()) + "</span>" +
        '<span class="sz">' + kb(f.size) + "</span></button>"
      );
    }
  }

  function drawTree(){
    const out = [];
    renderNode(root, 0, out);
    treeEl.innerHTML = out.length ? out.join("") : '<p class="notice">一致するファイルがありません</p>';
  }

  treeEl.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.dir !== undefined) {
      const p = btn.dataset.dir;
      expanded.has(p) ? expanded.delete(p) : expanded.add(p);
      store.set("expanded", [...expanded]);
      drawTree();
    } else if (btn.dataset.file !== undefined) {
      select(btn.dataset.file);
    }
  });

  document.getElementById("q").addEventListener("input", e => {
    filter = e.target.value.trim().toLowerCase();
    drawTree();
  });
  document.getElementById("expand").addEventListener("click", () => {
    const all = [];
    (function walk(n){ for (const d of n.dirs.values()) { all.push(d.path); walk(d); } })(root);
    expanded = new Set(all); store.set("expanded", all); drawTree();
  });
  document.getElementById("collapse").addEventListener("click", () => {
    expanded = new Set(); store.set("expanded", []); drawTree();
  });

  // ---- CSV ----
  function parseCSV(text){
    const rows = [];
    let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c !== "\r") cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.length > 1 || r[0] !== "");
  }

  // ---- pane ----
  const headEl = document.getElementById("head");
  const bodyEl = document.getElementById("body");
  let mode = store.get("mode", "table");

  function renderIntro(){
    headEl.innerHTML = "";
    bodyEl.innerHTML =
      '<div class="intro">' +
        "<h1>リポジトリの中身を、ツリーでたどる</h1>" +
        '<p class="lede">左のツリーからファイルを選ぶと、ここに中身が出ます。CSV は表として、その他はテキストとして表示します。このページは公開時点のリポジトリの写しです。</p>' +

        '<h2>ファイル種別</h2>' +
        '<div class="card"><div class="legend">' +
          ["csv","txt","py","ps1","md","ts","tsx","json","css","svg"].map(t => {
            const [lbl, tok] = TYPES[t];
            return '<span style="--tc:var(' + tok + ')">' + lbl + "</span>";
          }).join("") +
        "</div></div>" +

        '<h2>自分の環境でツリー表示にするには</h2>' +
        '<div class="card"><div class="ways">' +
          '<div class="way"><span class="k">1</span><span class="t">VS Code で開く</span>' +
            '<span class="d">リポジトリのフォルダを VS Code で開くと、左のエクスプローラーがそのままツリーになります。' +
            '<code>code .</code> でフォルダごと開けます。Windows なら Explorer で右クリック →「Code で開く」。</span></div>' +
          '<div class="way"><span class="k">2</span><span class="t">GitHub 上で見る</span>' +
            '<span class="d">リポジトリのページ左上の <code>t</code> キー（ファイル検索）か、ファイル一覧左の «Files» サイドバーでツリーを開けます。' +
            'ブランチ切り替えもここでできます。</span></div>' +
          '<div class="way"><span class="k">3</span><span class="t">コマンドでツリーを出す</span>' +
            '<span class="d">PowerShell なら <code>tree /F</code>、macOS / Linux なら <code>tree -I &quot;.git|node_modules&quot;</code>。' +
            'Git 管理下のファイルだけなら <code>git ls-files</code> が確実です。</span></div>' +
          '<div class="way"><span class="k">4</span><span class="t">このページを作り直す</span>' +
            '<span class="d">リポジトリの <code>tools/build_tree_view.py</code> を実行すると、最新の内容でこの HTML を生成できます。</span></div>' +
        "</div></div>" +
      "</div>";
  }

  function renderFile(f){
    const [lbl, tok] = typeOf(f.path);
    const parts = f.path.split("/");
    const dir = parts.slice(0, -1).join("/");
    const isCSV = f.path.toLowerCase().endsWith(".csv") && !f.binary;

    headEl.innerHTML =
      '<div class="filehead">' +
        '<span class="path">' + (dir ? '<span class="up">' + esc(dir) + "/</span>" : "") + esc(parts[parts.length-1]) + "</span>" +
        '<span class="badge" style="--tc:var(' + tok + ')">' + esc(lbl) + "</span>" +
        '<span class="meta"><span>' + kb(f.size) + "</span>" +
          (f.binary ? "" : "<span>" + f.lines + " 行</span>") + "</span>" +
        (isCSV
          ? '<span class="seg"><button id="m-table" aria-pressed="' + (mode === "table") + '">表</button>' +
            '<button id="m-raw" aria-pressed="' + (mode !== "table") + '">生テキスト</button></span>'
          : "") +
        '<button class="mini" id="copy">パスをコピー</button>' +
      "</div>";

    document.getElementById("copy").addEventListener("click", e => {
      navigator.clipboard.writeText(f.path).then(
        () => { e.target.textContent = "コピーしました"; setTimeout(() => { e.target.textContent = "パスをコピー"; }, 1600); },
        () => { e.target.textContent = "コピーできません"; }
      );
    });
    if (isCSV) {
      document.getElementById("m-table").addEventListener("click", () => { mode = "table"; store.set("mode", mode); renderFile(f); });
      document.getElementById("m-raw").addEventListener("click", () => { mode = "raw"; store.set("mode", mode); renderFile(f); });
    }

    if (f.binary) {
      bodyEl.innerHTML = '<p class="notice">バイナリファイルのため中身は表示できません（' + kb(f.size) + "）。</p>";
      return;
    }
    if (isCSV && mode === "table") {
      const rows = parseCSV(f.content);
      if (!rows.length) { bodyEl.innerHTML = '<p class="notice">空のファイルです。</p>'; return; }
      const head = rows[0], body = rows.slice(1);
      bodyEl.innerHTML =
        '<div class="tablewrap"><table><thead><tr><th></th>' +
        head.map(h => "<th>" + esc(h) + "</th>").join("") +
        "</tr></thead><tbody>" +
        body.map((r, i) =>
          '<tr><td class="rn">' + (i+1) + "</td>" +
          head.map((_, c) => "<td>" + esc(r[c] === undefined ? "" : r[c]) + "</td>").join("") +
          "</tr>"
        ).join("") +
        "</tbody></table></div>";
      return;
    }
    const lines = f.content.split("\n");
    if (lines.length && lines[lines.length-1] === "") lines.pop();
    bodyEl.innerHTML =
      '<div class="code">' +
      lines.map((l, i) => '<div class="ln"><span class="n">' + (i+1) + '</span><span class="t">' + (esc(l) || "&nbsp;") + "</span></div>").join("") +
      "</div>" +
      (f.truncated ? '<p class="notice">先頭 ' + lines.length + " 行のみ表示しています（ファイルが大きいため）。</p>" : "");
    bodyEl.scrollTop = 0;
  }

  function select(path){
    selected = path;
    store.set("selected", path);
    drawTree();
    const f = byPath.get(path);
    f ? renderFile(f) : renderIntro();
  }

  // ---- boot ----
  document.getElementById("branch").textContent = DATA.branch;
  document.getElementById("nfiles").textContent = FILES.length;
  document.getElementById("ndirs").textContent = countDirs(root);
  document.getElementById("tsize").textContent = kb(FILES.reduce((a,f) => a + f.size, 0));
  drawTree();
  selected ? select(selected) : renderIntro();
})();
</script>
